<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每一句都是一幅畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* repo 轉教學動畫網頁｜通用骨架（黑板舞台）。新動畫只改「設定區」與「場景區」。 */
:root{
  --board:#23392f; --board-deep:#1a2b23; --frame:#6e4c31;
  --chalk:#efe9d8; --chalk-dim:#a9b3a6;
  --yellow:#f2c14e; --orange:#e8875b; --blue:#7fb6d9; --green:#8fd18a; --red:#e66a5c;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body)}
/* ===== 播放器版面公版（研習平台頁同一套規則）=====
   1) 播放區 .player（標題列＋舞台＋字幕＋控制列）剛好佔一個視窗高；章節、延伸閱讀、出處在下方，往下捲才看到。
   2) 舞台吃「扣掉標題列、字幕、控制列後的剩餘空間」：.stage-area 是容器查詢容器，.board 用 cqw／cqh 算出 16:9 最大尺寸並置中；
      木框寬度只用 --bw 變數計入（SVG 本身維持 16:9），不得再用固定像素去扣高度。
   3) 進度條列可收合（#toggleSeek），預設收起；收起時舞台自動變大。字幕至少預留兩行，段落切換時舞台不跳動。    4) 標註工具（手寫筆跡＋文字，.annoLayer 掛在 .board 內）：「標註工具 ▸／▾」（#toggleInk）收合一列工具列，預設收起；標註以段落為單位、只存在記憶體；?embed=1 不啟用。 */
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.player{box-sizing:border-box;height:100vh;height:100dvh;padding-block:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.player>header,.player>.controls{flex:none}
.theater{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.theater .caption{align-self:stretch;flex:none}
.stage-area{flex:1 1 0;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:center;container-type:size}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{--bw:14px;box-sizing:border-box;border:var(--bw) solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);flex:none;max-width:100%;
  width:100%;width:min(100cqw, calc((100cqh - 2 * var(--bw)) * 16 / 9 + 2 * var(--bw)))}
/* 全螢幕：theater 本身就是全螢幕元素，沿用同一套規則（舞台吃剩餘空間、字幕預留兩行；字幕字級與行高用 vh／vw） */
.theater:fullscreen{background:var(--board-deep);gap:1.5vh;padding:2vh 2vw;box-sizing:border-box}
.theater:fullscreen .caption{text-align:center;font-size:min(2.4vw,3.2vh);line-height:1.4;min-height:2.8em;max-width:100%}
@media (max-width:640px){.board{--bw:8px}}
/* 內嵌（?embed=1）：只留舞台與字幕，尺寸全用 vh，播放由外層 postMessage 控制（版面公版不套用） */
html.embed body{padding:0;overflow:hidden}
html.embed header,html.embed .controls,html.embed .chapters,html.embed .works,html.embed .note{display:none}
html.embed .wrap{max-width:none;gap:0;padding:0}
html.embed .player,html.embed .stage-area{display:contents}
html.embed .stage-area{container-type:normal}
html.embed .theater{flex:none;gap:1vh}
html.embed .board{width:min(100%, calc(89vh * 16 / 9));border-width:1.4vh}
html.embed .caption{font-size:2.6vh;line-height:1.4;min-height:3.8vh;text-align:center;padding:0 1vh;margin:0}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:3em;margin:0}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
#fs{margin-left:auto}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#toggleSeek[aria-expanded="true"]{border-color:var(--yellow);color:var(--yellow)}
/* 進度條列：獨佔 .controls 的第二列；黃色 6px 粗軌道畫在 #seekMarks（細線＝段落分界），上面疊透明的 range 與 16px 圓拇指 */
.seekrow{display:flex;flex:1 0 100%;align-items:center;gap:12px}
.seekrow[hidden]{display:none}
#seekWrap{position:relative;flex:1 1 200px;min-width:120px;height:20px}
#scrub{position:relative;z-index:1;-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;padding:0;margin:0;border:0;border-radius:0;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:6px;background:transparent}
#scrub::-moz-range-track{height:6px;border:0;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#scrub::-moz-range-thumb{box-sizing:border-box;width:16px;height:16px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#seekMarks{position:absolute;left:8px;right:8px;top:7px;height:6px;border-radius:3px;overflow:hidden;background:var(--yellow);pointer-events:none}
#seekMarks i{position:absolute;top:0;bottom:0;width:1px;background:var(--board-deep)}
#time{flex:none;width:8.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.85rem}
/* 標註工具（手寫筆跡＋文字）：標註層蓋在舞台上，平常 pointer-events:none，只有畫筆／文字啟用時才攔截；?embed=1 不建立 */
.board{position:relative}
.annoLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;--u:1px}
.annoLayer canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none;border-radius:0;aspect-ratio:auto;box-shadow:none}
.annoLayer canvas.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.annoLayer canvas.on.text-mode{cursor:text}
.annoLabels{position:absolute;inset:0;pointer-events:none}
.annoLabel{position:absolute;transform:translateY(-50%);font-family:var(--font-chalk,serif);font-size:calc(34 * var(--u));font-weight:700;line-height:1.25;padding:calc(4 * var(--u)) calc(14 * var(--u));background:rgba(26,43,35,.82);border:calc(2 * var(--u)) solid;border-radius:calc(10 * var(--u));white-space:pre-wrap;max-width:56%;word-break:break-word}
.annoInput{position:absolute;transform:translateY(-50%);box-sizing:border-box;width:max(180px,32%);max-width:92%;font-family:var(--font-chalk,serif);font-size:max(16px,calc(30 * var(--u)));font-weight:700;pointer-events:auto;background:rgba(26,43,35,.95);border:2px dashed var(--yellow,#f2c14e);color:var(--chalk,#efe9d8)}
.annoInput[hidden]{display:none}
#toggleInk[aria-expanded="true"]{border-color:var(--yellow,#f2c14e);color:var(--yellow,#f2c14e)}
/* 工具列：獨佔 .controls 的一整列 */
.annoRow{display:flex;flex:1 0 100%;flex-wrap:wrap;align-items:center;gap:8px 10px}
.annoRow[hidden]{display:none}
.annoSwatches{display:inline-flex;align-items:center;gap:8px}
.annoSwatch{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.annoSwatch[aria-pressed="true"]{border-color:#fff;outline:2px solid var(--board-deep,var(--bg,#1a2b23))}
.annoRow button[aria-pressed="true"]:not(.annoSwatch){border-color:var(--yellow,#f2c14e);color:var(--board-deep,#1a2b23);background:var(--yellow,#f2c14e)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.85rem;padding:.25em .8em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works a{color:var(--chalk);text-underline-offset:3px}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
</style>

<div class="wrap">
  <section class="player" aria-label="動畫播放器">
    <header>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <div class="theater" id="theater">
      <div class="stage-area"><div class="board"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"></svg></div></div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="controls">
      <button id="prev" type="button">上一段</button>
      <button id="play" type="button">播放</button>
      <button id="next" type="button">下一段</button>
      <button id="toggleSeek" type="button" aria-expanded="false" aria-controls="seekrow">進度條 ▸</button>
      <button id="fs" type="button">全螢幕</button>
      <div class="seekrow" id="seekrow" hidden>
        <div id="seekWrap">
          <input id="scrub" type="range" min="0" max="1" step="0.05" value="0" aria-label="時間軸">
          <div id="seekMarks" aria-hidden="true"></div>
        </div>
        <span id="time"></span>
      </div>
    </div>
  </section>
  <ul class="chapters" id="chapters"></ul>
  <section class="works" aria-labelledby="works-h"><h2 id="works-h">延伸閱讀</h2><ul id="works"></ul></section>
  <p class="note" id="note"></p>
</div>

<script>
'use strict';
// ===================== 設定區（段落與字幕由 timing.json 注入）=====================
// ===== 教學動畫共用圖形（不得與範本播放器或工具重名）=====
const C = { yellow: 'var(--yellow)', blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', orange: 'var(--orange)', purple: '#b9a3e3', chalk: 'var(--chalk)', dim: 'var(--chalk-dim)', deep: 'var(--board-deep)' };
function arrow(x1, y1, x2, y2, color = C.dim, op = 1, both = false, k = 1, dash = '') {
  const ex = lerp(x1, x2, k), ey = lerp(y1, y2, k);
  const ang = Math.atan2(y2 - y1, x2 - x1), h = 16;
  const head = (x, y, a) => `<polygon points="${x},${y} ${x - h * Math.cos(a - 0.45)},${y - h * Math.sin(a - 0.45)} ${x - h * Math.cos(a + 0.45)},${y - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  let g = `<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="4" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (k >= 0.99) { g += head(x2, y2, ang); if (both) g += head(x1, y1, ang + Math.PI); }
  return g + '</g>';
}
// 曲線箭頭：二次貝茲，k 為繪製進度（以 dasharray 截斷）
function curve(x1, y1, cx, cy, x2, y2, color = C.dim, op = 1, k = 1, label = '', lx = 0, ly = 0) {
  const len = 1400;
  let g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="10 9" pathLength="${len}" style="stroke-dashoffset:0"/>`;
  if (k < 0.99) g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" pathLength="${len}" stroke-dasharray="${(len * k).toFixed(1)} ${len}"/>`;
  else {
    const a = Math.atan2(y2 - cy, x2 - cx), h = 16;
    g += `<polygon points="${x2},${y2} ${x2 - h * Math.cos(a - 0.45)},${y2 - h * Math.sin(a - 0.45)} ${x2 - h * Math.cos(a + 0.45)},${y2 - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  }
  if (label) g += txt(lx, ly, label, { c: 't-body', s: 24, f: color, o: k >= 0.99 ? 1 : 0 });
  return g + '</g>';
}
function hframe(x, y, w, h, op, label = '', color = C.yellow, glow = 0, size = 32) {
  return `<g opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="rgba(242,193,78,${0.04 + 0.08 * glow})" stroke="${color}" stroke-width="${4 + 2 * glow}" stroke-dasharray="16 12"/>` +
    (label ? txt(x + 26, y + 44, label, { s: size, w: 1, f: color }) : '') + '</g>';
}
function card(x, y, W, h, op, lines, color = C.chalk) {
  // lines: [[文字, 字級, 顏色, 粗體, 字型類別, 置中]]，依序往下排
  let g = `<g opacity="${op}">${box(x, y, W, h, color, 1, C.deep)}`;
  let yy = y + 14;
  for (const [s, size = 28, f = C.chalk, bold = false, c = 't-chalk', cx = false] of lines) {
    yy += size * 1.25;
    g += txt(cx ? x + W / 2 : x + 24, yy, s, { s: size, f, w: bold, c, a: cx ? 'middle' : 'start' });
    yy += size * 0.3;
  }
  return g + '</g>';
}
function ccard(x, y, w, h, op, title, sub, color = C.chalk, tsize = 32, ssize = 24) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}` +
    txt(x + w / 2, y + h / 2 + (sub ? -6 : tsize * 0.35), title, { a: 'middle', s: tsize, w: 1, f: color }) +
    (sub ? txt(x + w / 2, y + h / 2 + ssize + 8, sub, { a: 'middle', c: 't-body', s: ssize, f: C.dim }) : '') + '</g>';
}
function chip(x, y, w, label, op, color = C.chalk, size = 26, h = 58) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}${txt(x + w / 2, y + h / 2 + size * 0.36, label, { a: 'middle', s: size, f: color })}</g>`;
}
function tick(x, y, s, op, color = C.green) {
  return `<path d="M${x - s} ${y} L${x - s / 3} ${y + s * 0.7} L${x + s} ${y - s * 0.8}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
}
function cross(x, y, s, op, color = C.red) {
  return `<g opacity="${op}" stroke="${color}" stroke-width="12" stroke-linecap="round"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function dot(x, y, r, color, op = 1) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${op}"/>`; }
function underline(x1, x2, y, k, color = C.yellow, op = 1) { return `<line x1="${x1}" y1="${y}" x2="${lerp(x1, x2, k)}" y2="${y}" stroke="${color}" stroke-width="4" opacity="${op}"/>`; }
// 依進度逐一出現：第 i 個元素在 t0 + i*step 開始、花 dur 秒
const stagger = (u, t0, i, step = 0.6, dur = 0.7) => ease(P(u, t0 + i * step, t0 + i * step + dur));

// 「每一句都是一幅畫」（g6-08，六年級童詩寫景）共用核心：META、2D 小工具（沿用前集）、three.js 圖層 PscGL。畫面只由段內秒數 u 決定。
const META = {
  title: '每一句都是一幅畫',
  subtitle: '10 段・約 2 分鐘・六年級童詩（寫景）第一集',
  ariaLabel: '童詩不是只有字少：每一句詩都長出一幅畫。童詩分行分節；月夜裡月亮像燈、月光灑在海上樹梢窗前的排比、夜風沙沙落葉紛紛；寫景童詩四步：選景、五感、比喻或擬人、感受。',
  note: '出處：作文寫作要領（六年級童詩寫景、排比技巧練習）、香港教育局資優教育學校網絡分享簡報（童詩特色）、國小海洋童詩教案（五感、比喻擬人、感受）。〈月夜〉與散文對照句為自編；夜空、月亮、海面、樹、窗、落葉等立體畫面是想像的示意，由 three.js（r170，MIT 授權）繪製。鍵盤：空白鍵播放／暫停、左右鍵換段。畫面只由時間決定。',
  works: [],
};

const PSC_WOOD = '#a9784f';
const PSC_BLUE = '#7fb6d9';
const PSC_ORANGE = '#F0B27A';
const PSC_YELLOW = '#f2c14e';
const PSC_CREAM = '#efe9d8';
const PSC_DEEP = '#1a2b23';
const pscK = (u, a, b) => ease(P(u, a, b));
const pscLerp = (a, b, k) => a + (b - a) * k;
const pscN = (value) => Number.isFinite(Number(value)) ? Number(Number(value).toFixed(2)) : 0;
const pscO = (value) => Math.max(0, Math.min(1, Number(value) || 0)).toFixed(3);

function pscHead(u, i) {
  const seg = SEGS[i];
  return head(u, seg.grp, seg.name);
}

function pscPaint(svg) {
  return svg.replace(/font-size="24"/g, 'font-size="26"')
    .replace(/<text ([^>]*?)fill="([^"]+)"/g, '<text $1style="fill:$2" fill="$2"');
}

function pscMetaphorTag(op = 1) {
  if (op <= 0.001) return '';
  return `<g opacity="${pscO(op)}">${box(1375, 56, 165, 60, PSC_ORANGE, 1, PSC_DEEP)}${txt(1457, 98, '比喻', { a: 'middle', s: 30, w: 1, f: PSC_ORANGE })}</g>`;
}

function pscLabel(cx, y, value, size = 30, color = PSC_CREAM, op = 1) {
  if (op <= 0.001) return '';
  return txt(cx, y, value, { a: 'middle', s: size, w: 1, f: color, o: op });
}

function pscPhrase(x, y, value, size = 30, color = PSC_CREAM, op = 1, anchor = 'start') {
  if (op <= 0.001 || !value) return '';
  return txt(x, y, value, { a: anchor, s: size, w: 1, f: color, o: op });
}

function pscPath(d, color = PSC_CREAM, width = 5, op = 1, fill = 'none', dash = '') {
  if (op <= 0.001) return '';
  return `<path d="${d}" fill="${fill}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" opacity="${pscO(op)}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
}

function pscLine(x1, y1, x2, y2, color = PSC_CREAM, width = 5, op = 1, dash = '', progress = 1) {
  if (op <= 0.001 || progress <= 0.001) return '';
  const ex = pscLerp(x1, x2, progress), ey = pscLerp(y1, y2, progress);
  return pscPath(`M${pscN(x1)} ${pscN(y1)} L${pscN(ex)} ${pscN(ey)}`, color, width, op, 'none', dash);
}

function pscArrowTo(x1, y1, x2, y2, op = 1, p = 1, size = 16, dash = '') {
  if (op <= 0.001 || p <= 0.001) return '';
  const ex = pscLerp(x1, x2, p), ey = pscLerp(y1, y2, p), a = Math.atan2(y2 - y1, x2 - x1);
  let g = pscLine(x1, y1, ex, ey, PSC_YELLOW, 4, op, dash);
  if (p >= 0.99) {
    g += `<polygon points="${x2},${y2} ${pscN(x2 - size * Math.cos(a - 0.48))},${pscN(y2 - size * Math.sin(a - 0.48))} ${pscN(x2 - size * Math.cos(a + 0.48))},${pscN(y2 - size * Math.sin(a + 0.48))}" fill="${PSC_YELLOW}" opacity="${pscO(op)}"/>`;
  }
  return g;
}

// 黃虛線弧：二次貝茲，k 為繪製進度（de Casteljau 截段）
function pscCurve(x1, y1, cx, cy, x2, y2, k, op = 1, color = PSC_YELLOW, width = 4, dash = '') {
  if (op <= 0.001 || k <= 0.001) return '';
  const px = pscLerp(x1, cx, k), py = pscLerp(y1, cy, k);
  const qx = pscLerp(cx, x2, k), qy = pscLerp(cy, y2, k);
  const ex = pscLerp(px, qx, k), ey = pscLerp(py, qy, k);
  return pscPath(`M${pscN(x1)} ${pscN(y1)} Q${pscN(px)} ${pscN(py)} ${pscN(ex)} ${pscN(ey)}`, color, width, op, 'none', dash);
}

function pscFlash(u, start) {
  const fadeIn = pscK(u, start, start + 0.08);
  const fadeOut = 1 - pscK(u, start + 0.42, start + 0.5);
  return Math.max(0, Math.min(fadeIn, fadeOut));
}

function pscBlock(x, y, w, h, color, op = 1, dashed = false, flash = 0) {
  if (op <= 0.001 || w <= 2 || h <= 2) return '';
  if (dashed) {
    const fill = flash > 0.01 ? `rgba(242,193,78,${(0.5 * flash).toFixed(3)})` : 'rgba(239,233,216,.012)';
    return `<rect x="${pscN(x)}" y="${pscN(y)}" width="${pscN(w)}" height="${pscN(h)}" rx="14" fill="${fill}" stroke="${color}" stroke-width="5" stroke-dasharray="14 10" opacity="${pscO(op)}"/>`;
  }
  return `<rect x="${pscN(x)}" y="${pscN(y)}" width="${pscN(w)}" height="${pscN(h)}" rx="14" fill="${color}" fill-opacity=".22" stroke="${PSC_CREAM}" stroke-width="4" opacity="${pscO(op)}"/>`;
}

// 肉條：圓角長條；text 為白字 30px 置中；dashed 為虛線空條（字改黃色）
function pscMeat(x, y, w, h, color, text, op = 1, dashed = false, flash = 0) {
  if (op <= 0.001) return '';
  const lit = flash > 0.01;
  const fill = dashed ? 'none' : lit ? `rgba(242,193,78,${(0.5 * flash).toFixed(3)})` : color;
  const fillOp = dashed || lit ? '' : ' fill-opacity="0.14"';
  const rect = `<rect x="${pscN(x)}" y="${pscN(y)}" width="${pscN(w)}" height="${pscN(h)}" rx="14" fill="${fill}"${fillOp} stroke="${color}" stroke-width="4"${dashed ? ' stroke-dasharray="14 10"' : ''} opacity="${pscO(op)}"/>`;
  return rect + (text ? pscLabel(x + w / 2, y + h / 2 + 11, text, 30, dashed ? PSC_YELLOW : PSC_CREAM, op) : '');
}

// 排比柱：白粉筆矩形由底往上長（grow），柱頂一條橫線當柱頭；grow ≥ 0.98 才寫字
function pscPillar(x, top, w, bottom, text, op = 1, grow = 1) {
  if (op <= 0.001 || grow <= 0.001) return '';
  const k = Math.max(0, Math.min(1, grow));
  const vis = bottom - (bottom - top) * k;
  let g = `<g opacity="${pscO(op)}"><rect x="${pscN(x)}" y="${pscN(vis)}" width="${pscN(w)}" height="${pscN(bottom - vis)}" fill="rgba(239,233,216,.05)" stroke="${PSC_CREAM}" stroke-width="5"/>`;
  g += pscPath(`M${pscN(x - 8)} ${pscN(vis)} H${pscN(x + w + 8)}`, PSC_CREAM, 7, 1) + '</g>';
  if (text && k >= 0.98) g += pscLabel(x + w / 2, top + 70, text, 30, PSC_CREAM, op);
  return g;
}

// 名言卷軸：紙面由中間往左右展開（寬 × open）；open ≥ 0.98 才寫字
function pscScroll(x, y, w, h, text, source, op = 1, open = 1) {
  if (op <= 0.001 || open <= 0.001) return '';
  const k = Math.max(0, Math.min(1, open));
  const pw = w * k, px = x + w / 2 - pw / 2;
  let g = `<g opacity="${pscO(op)}"><rect x="${pscN(px)}" y="${pscN(y)}" width="${pscN(pw)}" height="${pscN(h)}" fill="rgba(239,233,216,.06)" stroke="${PSC_CREAM}" stroke-width="3"/>`;
  g += pscPath(`M${pscN(x)} ${pscN(y - 10)} V${pscN(y + h + 10)} M${pscN(x + w)} ${pscN(y - 10)} V${pscN(y + h + 10)}`, PSC_CREAM, 6, 1) + '</g>';
  if (k >= 0.98) {
    g += pscPhrase(x + w / 2 - 50, y + h / 2 + 12, text, 34, PSC_CREAM, op, 'middle');
    g += pscPhrase(x + w - 85, y + h / 2 + 12, source, 26, 'rgba(239,233,216,.75)', op, 'middle');
  }
  return g;
}

// 梯子：兩側直桿＋橫木
function pscLadder(x1, x2, top, bottom, rungs, op = 1) {
  if (op <= 0.001) return '';
  let g = pscPath(`M${x1} ${top} V${bottom} M${x2} ${top} V${bottom}`, PSC_CREAM, 6, op);
  rungs.forEach((y) => { g += pscPath(`M${x1} ${y} H${x2}`, PSC_CREAM, 5, op); });
  return g;
}

// 石塊：有步驟小字（step）時為「步驟字＋短語」兩行；無步驟字時短語置中；slide 由下方滑入 30px
function pscStone(x, y, w, h, color, phrase, step, op, slide = 1, dashed = false) {
  if (op <= 0.001 || w <= 2 || h <= 2) return '';
  const dy = 30 * (1 - Math.max(0, Math.min(1, slide)));
  const fill = color === PSC_ORANGE ? 'rgba(240,178,122,.12)' : color === PSC_BLUE ? 'rgba(127,182,217,.12)' : 'rgba(242,193,78,.12)';
  const rich = w >= 80 && h >= 60;
  let g = `<g transform="translate(0 ${pscN(dy)})" opacity="${pscO(op)}"><rect x="${pscN(x)}" y="${pscN(y)}" width="${pscN(w)}" height="${pscN(h)}" rx="14" fill="${dashed ? 'none' : fill}" stroke="${color}" stroke-width="${w < 50 ? 4 : 5}"${dashed ? ' stroke-dasharray="8 6"' : ''}/>`;
  if (!dashed && rich) g += `<path d="M${pscN(x + 12)} ${pscN(y + 14)} l10 8 M${pscN(x + w - 24)} ${pscN(y + h - 16)} l10 -8" fill="none" stroke="rgba(239,233,216,.35)" stroke-width="2"/>`;
  g += '</g>';
  if (phrase && step && rich) {
    g += pscLabel(x + w / 2, y + 30, step, 24, 'rgba(239,233,216,.75)', op) + pscLabel(x + w / 2, y + 76, phrase, 30, PSC_CREAM, op);
  } else if (phrase) {
    g += pscLabel(x + w / 2, y + h / 2 + 11, phrase, 30, PSC_CREAM, op);
  }
  return g;
}

// 小牆（圖示用，無字）
function pscWall(x, top, w, bottom, op = 1, dashed = false) {
  if (op <= 0.001) return '';
  let g = `<g opacity="${pscO(op)}"><rect x="${pscN(x)}" y="${pscN(top)}" width="${pscN(w)}" height="${pscN(bottom - top)}" fill="${dashed ? 'none' : 'rgba(239,233,216,.04)'}" stroke="${PSC_CREAM}" stroke-width="4"${dashed ? ' stroke-dasharray="12 9"' : ''}/>`;
  if (!dashed) for (let yy = top + 36; yy < bottom; yy += 36) g += pscLine(x, yy, x + w, yy, 'rgba(239,233,216,.46)', 2);
  return g + '</g>';
}

// 主張牌：黃框木牌，label 置中
function pscBoard(x1, x2, y, h, label, op = 1, flash = 0) {
  if (op <= 0.001) return '';
  const fill = flash > 0.01 ? `rgba(242,193,78,${(0.5 * flash).toFixed(3)})` : 'rgba(242,193,78,.12)';
  return `<rect x="${pscN(x1)}" y="${pscN(y)}" width="${pscN(x2 - x1)}" height="${pscN(h)}" rx="10" fill="${fill}" stroke="${PSC_YELLOW}" stroke-width="5" opacity="${pscO(op)}"/>` +
    pscLabel((x1 + x2) / 2, y + h / 2 + 11, label, 30, PSC_CREAM, op);
}

// 小標籤（黃框深底，字 30px）
function pscTag(x, y, w, label, op = 1) {
  if (op <= 0.001) return '';
  return `<g opacity="${pscO(op)}">${box(x, y, w, 64, PSC_YELLOW, 1, 'rgba(26,43,35,.94)')}${txt(x + w / 2, y + 42, label, { a: 'middle', s: 30, w: 1, f: PSC_CREAM })}</g>`;
}

function pscCardFrame(x, y, w, h, op = 1) {
  if (op <= 0.001) return '';
  return `<g opacity="${pscO(op)}">${box(x, y, w, h, PSC_CREAM, 1, 'rgba(239,233,216,.015)')}</g>`;
}

function pscTitleCard(x, y, w, value, size, op) {
  if (op <= 0.001) return '';
  return `<g opacity="${pscO(op)}"><rect x="${x}" y="${y}" width="${w}" height="56" rx="12" fill="rgba(26,43,35,.96)" stroke="${PSC_CREAM}" stroke-width="4"/></g>` +
    txt(x + w / 2, y + 38, value, { a: 'middle', s: size, w: 1, f: PSC_YELLOW, o: op });
}

// 標題列：〈一句話的〉＋黃字「啟示」＋〉
function pscColorTitle(cx, y, before, mark, after, size, op) {
  if (op <= 0.001) return '';
  return `<text x="${cx}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${PSC_CREAM}" opacity="${pscO(op)}">` +
    `<tspan fill="${PSC_CREAM}" style="fill:${PSC_CREAM}">${esc(before)}</tspan>` +
    `<tspan fill="${PSC_YELLOW}" style="fill:${PSC_YELLOW}">${esc(mark)}</tspan>` +
    `<tspan fill="${PSC_CREAM}" style="fill:${PSC_CREAM}">${esc(after)}</tspan></text>`;
}

function pscStageTitle(u, value) {
  return pscLabel(800, 240, value, 36, PSC_YELLOW, pscK(u, 0.2, 0.8));
}

function pscWorkTag(x, y, w, value, op = 1) {
  return pscLabel(x + w / 2, y, value, 34, PSC_CREAM, op);
}

// 小柱（三根，各寬 10、高 34、間距 16，無字）
function pscMiniPillars(cx, cy, op = 1) {
  if (op <= 0.001) return '';
  let g = `<g opacity="${pscO(op)}">`;
  [-21, -5, 11].forEach((dx) => { g += `<rect x="${cx + dx}" y="${cy - 17}" width="10" height="34" fill="rgba(239,233,216,.06)" stroke="${PSC_CREAM}" stroke-width="3"/>`; });
  return g + '</g>';
}

// 小卷軸（寬 44、高 30，兩側小軸，無字）
function pscMiniScroll(cx, cy, op = 1) {
  if (op <= 0.001) return '';
  return `<g opacity="${pscO(op)}"><rect x="${cx - 18}" y="${cy - 11}" width="36" height="22" fill="rgba(239,233,216,.06)" stroke="${PSC_CREAM}" stroke-width="2.5"/>` +
    pscPath(`M${cx - 20} ${cy - 15} V${cy + 15} M${cx + 20} ${cy - 15} V${cy + 15}`, PSC_CREAM, 4, 1) + '</g>';
}

// 粉筆小人（nod 為點頭進度）
function pscDoll(cx, cy, scale = 1, op = 1, nod = 0) {
  const dy = 10 * Math.sin(Math.PI * Math.max(0, Math.min(1, nod)));
  return `<g transform="translate(${pscN(cx)} ${pscN(cy + dy)}) scale(${pscN(scale)})" opacity="${pscO(op)}" stroke-linecap="round" stroke-linejoin="round">` +
    `<circle cx="0" cy="-72" r="31" fill="rgba(240,217,189,.55)" stroke="${PSC_CREAM}" stroke-width="5"/>` +
    `<path d="M-28 -77 Q-21 -112 4 -105 Q27 -99 29 -75 Q9 -90 -4 -87 Q-18 -83 -28 -77Z" fill="${PSC_WOOD}" stroke="${PSC_CREAM}" stroke-width="3"/>` +
    `<path d="M-43 43 Q-40 -28 0 -28 Q40 -28 43 43Z" fill="rgba(127,182,217,.28)" stroke="${PSC_CREAM}" stroke-width="5"/>` +
    `<path d="M-37 -5 L-70 26 M37 -5 L70 26 M-19 43 L-30 91 M19 43 L30 91" fill="none" stroke="${PSC_CREAM}" stroke-width="9"/>` +
    `<circle cx="-10" cy="-67" r="3" fill="${PSC_WOOD}"/><circle cx="10" cy="-67" r="3" fill="${PSC_WOOD}"/></g>`;
}

// 四段地圖（右上角）：active＝1–4 為亮起的那段，0 為全部不亮；op 為整組淡入
function pscMiniMap(active, op = 1) {
  if (op <= 0.001) return '';
  const xs = [1150, 1246, 1342, 1438], names = ['一段', '二段', '三段', '四段'];
  let g = `<g opacity="${pscO(op)}">`;
  xs.forEach((x, i) => {
    const on = active === i + 1;
    g += `<rect x="${x}" y="200" width="86" height="50" rx="8" fill="${on ? 'rgba(242,193,78,.35)' : 'rgba(127,182,217,.30)'}" stroke="${on ? PSC_YELLOW : PSC_CREAM}" stroke-width="${on ? 4 : 2}"/>`;
    g += txt(x + 43, 236, names[i], { a: 'middle', s: 30, w: 1, f: PSC_CREAM, o: on ? 1 : 0.7 });
  });
  return g + '</g>';
}

// 一行多色文字置中：parts＝[[文字, 顏色], …]，每段一個 tspan（fill 與 style 都寫）
function pscRich(cx, y, parts, size = 30, op = 1) {
  if (op <= 0.001) return '';
  const spans = parts.map(([t, c]) => `<tspan fill="${c}" style="fill:${c}">${esc(t)}</tspan>`).join('');
  return `<text x="${cx}" y="${y}" class="t-chalk" font-size="${size}" font-weight="700" text-anchor="middle" fill="${PSC_CREAM}" opacity="${pscO(op)}">${spans}</text>`;
}

// ===== 各段 =====

// ===================== three.js 圖層（WebGL 畫布墊在 SVG 後方，只由 u 決定）=====================
// 用法：在場景函式開頭呼叫 PscGL.show('s3', u, 15)；沒有立體畫面的段呼叫 PscGL.show(null, u, len)。
// 立體場景用 PscGL.register('s3', (THREE) => ({ scene, camera, update(u) {...} })) 註冊；build 只執行一次，update 每次 seek 都呼叫。
// 隨機請用 PscGL.rand(i, k)（固定種子），不要用 Math.random。
// 物件可帶 viewport: { x, y, w, h }（舞台座標）只畫在小窗內；相機 aspect 要等於 w／h。
const PscGL = (() => {
  let renderer = null, canvas = null, failed = false;
  const scenes = {};
  function ensure() {
    if (renderer || failed) return renderer;
    try {
      const stageEl = document.getElementById('stage');
      const board = stageEl.closest('.board') || stageEl.parentElement;
      canvas = document.createElement('canvas');
      canvas.width = 1600; canvas.height = 900;
      Object.assign(canvas.style, { position: 'absolute', left: '0', top: '0', width: '100%', height: '100%', pointerEvents: 'none', zIndex: '0', opacity: '0' });
      board.insertBefore(canvas, board.firstChild);
      Object.assign(stageEl.style, { position: 'relative', zIndex: '1' });
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1600, 900, false);
      renderer.setClearColor(0x000000, 0);
    } catch (e) { failed = true; renderer = null; }
    return renderer;
  }
  function fadeOf(u, len) { return Math.min(P(u, 0, 0.35), 1 - P(u, len - 0.35, len)); }
  return {
    register(id, build) { scenes[id] = { build, obj: null }; },
    show(id, u, len) {
      const r = ensure();
      if (!r) return;
      if (!id || !scenes[id]) { r.clear(); canvas.style.opacity = '0'; return; }
      const s = scenes[id];
      if (!s.obj) s.obj = s.build(THREE);
      s.obj.update(u);
      const v = s.obj.viewport; // 選用：{ x, y, w, h }（舞台座標，左上為原點），只畫在這個矩形內
      r.setScissorTest(!!v);
      r.clear();
      if (v) { r.setScissor(v.x, 900 - v.y - v.h, v.w, v.h); r.setViewport(v.x, 900 - v.y - v.h, v.w, v.h); }
      else r.setViewport(0, 0, 1600, 900);
      r.render(s.obj.scene, s.obj.camera);
      canvas.style.opacity = String(Math.max(0, fadeOf(u, len)).toFixed(3));
    },
    rand(i, k = 0) { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); },
    get available() { return !!ensure(); },
  };
})();

// g6-08 場景 A：分行分節、海上月光、樹梢白紗、落葉紛紛與寫詩練習。
// 本檔只定義 s2、s4、s5、s8、s10 與 pa_ 前綴的小工具。

function pa_camera(THREE) {
  const camera = new THREE.OrthographicCamera(-8, 8, 4.5, -4.5, 0.1, 100);
  camera.position.set(0, 0, 20);
  camera.lookAt(0, 0, 0);
  return camera;
}

function pa_gradient(THREE, scene, topHex, bottomHex, opacity = 0.92) {
  const geometry = new THREE.PlaneGeometry(1, 1);
  const pos = geometry.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const top = new THREE.Color(topHex), bottom = new THREE.Color(bottomHex);
  for (let i = 0; i < pos.count; i++) {
    const k = THREE.MathUtils.clamp(pos.getY(i) + 0.5, 0, 1);
    const color = bottom.clone().lerp(top, k);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const material = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity, depthWrite: false });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.scale.set(16, 9, 1);
  mesh.position.z = -8;
  scene.add(mesh);
  return mesh;
}

function pa_stars(THREE, scene, count = 160, size = 3.2) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const phases = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = -7.65 + PscGL.rand(i, 11) * 15.3;
    positions[i * 3 + 1] = -3.95 + PscGL.rand(i, 12) * 7.9;
    positions[i * 3 + 2] = -4.2 + PscGL.rand(i, 13) * 0.3;
    phases[i] = PscGL.rand(i, 14) * Math.PI * 2;
    colors[i * 3] = 0.36;
    colors[i * 3 + 1] = 0.48;
    colors[i * 3 + 2] = 0.72;
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const colorAttr = new THREE.BufferAttribute(colors, 3);
  colorAttr.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('color', colorAttr);
  const material = new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false });
  const points = new THREE.Points(geometry, material);
  scene.add(points);
  return {
    update(u) {
      for (let i = 0; i < count; i++) {
        const twinkle = 0.28 + 0.48 * (0.5 + 0.5 * Math.sin(u * 0.47 + phases[i]));
        colorAttr.setXYZ(i, 0.24 * twinkle, 0.39 * twinkle, 0.72 * twinkle);
      }
      colorAttr.needsUpdate = true;
    },
  };
}

function pa_waterSheet(THREE, scene, horizon, opacity, upperHex, lowerHex) {
  const nx = 72, ny = 30, width = 16, depth = 4.1;
  const positions = new Float32Array((nx + 1) * (ny + 1) * 3);
  const colors = new Float32Array((nx + 1) * (ny + 1) * 3);
  const indices = [];
  const upper = new THREE.Color(upperHex), lower = new THREE.Color(lowerHex);
  for (let j = 0; j <= ny; j++) {
    const v = j / ny;
    const color = upper.clone().lerp(lower, v);
    for (let i = 0; i <= nx; i++) {
      const n = j * (nx + 1) + i;
      positions[n * 3] = -width / 2 + width * i / nx;
      positions[n * 3 + 1] = horizon - depth * v;
      positions[n * 3 + 2] = -2.8 + v * 0.1;
      colors[n * 3] = color.r;
      colors[n * 3 + 1] = color.g;
      colors[n * 3 + 2] = color.b;
      if (i < nx && j < ny) {
        const a = n, b = n + 1, c = n + nx + 1, d = c + 1;
        indices.push(a, b, d, a, d, c);
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  const positionAttr = new THREE.BufferAttribute(positions, 3);
  positionAttr.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('position', positionAttr);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  const material = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.frustumCulled = false;
  scene.add(mesh);
  return {
    update(u, len) {
      const t = Math.min(u, len - 1.5) * 0.28;
      for (let j = 0; j <= ny; j++) {
        const v = j / ny;
        for (let i = 0; i <= nx; i++) {
          const n = j * (nx + 1) + i;
          const x = -width / 2 + width * i / nx;
          const wave = Math.sin(x * 1.14 + t + j * 0.22) * 0.035 + Math.sin(x * 0.58 - t * 0.72 + j * 0.39) * 0.022;
          positionAttr.setY(n, horizon - depth * v + wave * (0.45 + v));
        }
      }
      positionAttr.needsUpdate = true;
    },
  };
}

function pa_waveLines(THREE, scene, horizon, color, opacity, lineCount = 12) {
  const lines = [];
  const pointsPerLine = 72;
  for (let row = 0; row < lineCount; row++) {
    const positions = new Float32Array(pointsPerLine * 3);
    const geometry = new THREE.BufferGeometry();
    const attribute = new THREE.BufferAttribute(positions, 3);
    attribute.setUsage(THREE.DynamicDrawUsage);
    geometry.setAttribute('position', attribute);
    const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: opacity * (0.62 + 0.38 * PscGL.rand(row, 30)), depthWrite: false });
    const line = new THREE.Line(geometry, material);
    scene.add(line);
    lines.push({ attribute, row });
  }
  return {
    update(u, len) {
      const t = Math.min(u, len - 1.5) * 0.24;
      lines.forEach(({ attribute, row }) => {

function pa_moon(THREE, scene, x, y, z = -0.2, radius = 0.5) {
  const halo = new THREE.Mesh(new THREE.SphereGeometry(radius * 2.4, 24, 16), new THREE.MeshBasicMaterial({ color: 0xc4d5e5, transparent: true, opacity: 0.045, depthWrite: false }));
  halo.position.set(x, y, z - 0.25);
  halo.scale.set(1.2, 0.86, 0.18);
  scene.add(halo);
  const glow = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.5, 24, 16), new THREE.MeshBasicMaterial({ color: 0xf2e9d2, transparent: true, opacity: 0.12, depthWrite: false }));
  glow.position.set(x, y, z - 0.1);
  glow.scale.set(1.06, 1.06, 0.3);
  scene.add(glow);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(radius, 28, 20), new THREE.MeshBasicMaterial({ color: 0xf5eedb }));
  orb.position.set(x, y, z);
  scene.add(orb);
  return { halo, glow, orb };
}

function pa_branch(THREE, scene, from, to, radiusBottom, radiusTop, material, sides = 8) {
  const start = new THREE.Vector3(from[0], from[1], from[2] || 0);
  const end = new THREE.Vector3(to[0], to[1], to[2] || 0);
  const direction = new THREE.Vector3().subVectors(end, start);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, direction.length(), sides, 1), material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  scene.add(mesh);
  return mesh;
}

function pa_leafGeometry(THREE) {
  const shape = new THREE.Shape();
  shape.moveTo(0, -0.28);

  shape.bezierCurveTo(-0.08, 0.23, -0.025, 0.3, 0, 0.34);
  shape.bezierCurveTo(0.035, 0.29, 0.12, 0.2, 0.14, 0.08);
  shape.bezierCurveTo(0.17, -0.06, 0.1, -0.2, 0, -0.28);

}

function pa_leafVeinGeometry(THREE) {

function pa_card(x, y, w, h, op) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="rgba(12,22,36,.88)" stroke="rgba(239,233,216,.38)" stroke-width="3" opacity="${pscO(op)}"/>`;
}

function pa_richPhrase(x, y, parts, size, op = 1) {
  if (op <= 0.001) return '';
  const spans = parts.map(([value, color]) => `<tspan fill="${color}" style="fill:${color}">${esc(value)}</tspan>`).join('');
  return `<text x="${x}" y="${y}" class="t-chalk" font-size="${size}" font-weight="700" text-anchor="start" fill="${PSC_CREAM}" opacity="${pscO(op)}">${spans}</text>`;
}

function pa_oceanScene(THREE, options = {}) {
  const scene = new THREE.Scene();

  pa_gradient(THREE, scene, options.skyTop || '#0a1429', options.skyBottom || '#17253a', options.skyOpacity ?? 0.92);
  const stars = options.stars === false ? null : pa_stars(THREE, scene, options.starCount ?? 92, 2.8);
  const water = pa_waterSheet(THREE, scene, horizon, options.waterOpacity ?? 0.72, options.waterTop || '#23394d', options.waterBottom || '#101d2b');
  const waves = pa_waveLines(THREE, scene, horizon, options.waveColor || '#9bb5bc', options.waveOpacity ?? 0.16, options.waveCount ?? 14);
  return {
    scene,
    camera: pa_camera(THREE),
    water,
    waves,
    stars,
    update(u) {
      water.update(u, segmentLen);
      waves.update(u, segmentLen);
      if (stars) stars.update(Math.min(u, segmentLen - 1.5));
    },
  };
}

function pa_richLeft(x, y, parts, size = 30, op = 1) {

// 舞台座標（1600×900，y 向下）→ 正交相機世界座標（原點在舞台中心，y 向上）

const pb_richLeft = (x, y, parts, size = 34) => `<text x="${x}" y="${y}" class="t-chalk" font-size="${size}" font-weight="700" text-anchor="start" fill="${PSC_CREAM}">` +
  parts.map(([t, c]) => `<tspan fill="${c}" style="fill:${c}">${esc(t)}</tspan>`).join('') + '</text>';

// build 時用 Canvas 畫的漸層貼圖（天空、牆面等）
function pb_gradTex(THREE, stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;
}
// 圓形柔光貼圖（月暈、星點共用）
function pb_glowTex(THREE) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,248,226,1)'); gr.addColorStop(0.2, 'rgba(255,240,200,.5)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
  return t;
}
// 星點：toWorld(sx, sy) 給三維座標；reject 為真的舞台位置不放星（例如詩句卡底下）。回傳 update(u) 讓星點慢慢閃
function pb_stars(THREE, scene, n, seed, toWorld, reject) {
  const pos = [], base = [];
  for (let i = 0; base.length < n && i < n * 30; i++) {
    const sx = PscGL.rand(i, seed) * 1600, sy = PscGL.rand(i, seed + 1) * 560;
    if (reject && reject(sx, sy)) continue;
    pos.push(...toWorld(sx, sy)); base.push(0.45 + 0.55 * PscGL.rand(i, seed + 2));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const col = new THREE.BufferAttribute(new Float32Array(base.length * 3), 3);
  geo.setAttribute('color', col);
  const mat = new THREE.PointsMaterial({ size: 7, sizeAttenuation: false, map: pb_glowTex(THREE), vertexColors: true, transparent: true, depthWrite: false });
  scene.add(new THREE.Points(geo, mat));
  return (u) => {
    base.forEach((b, i) => { const k = b * (0.84 + 0.16 * Math.sin(u * 0.9 + i * 1.7)); col.setXYZ(i, k, k * 0.96, k * 0.82); });
    col.needsUpdate = true;
  };
}

// 正交相機用的山脊剪影：pts 為舞台座標（x 須由 0 到 1600），下方補到畫面底
function pb_ridge(THREE, scene, pts, color, z) {

  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshBasicMaterial({ color }));
  m.position.z = z; scene.add(m);
}

// ===== s6 月光灑在窗前：窗、斜照的光塊、窗台上的貓；地上的貓影慢慢拉長 =====
function pb_cat(THREE, mat) {
  // 貓（坐姿剪影）：座尾為原點，舞台座標（y 向下）換成 three 座標時 y 取反；K 為縮放
  const K = 0.8, V = (x, y) => new THREE.Vector2(x * K, -y * K);
  const ell = (cx, cy, rx, ry, n = 36) => Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2; return V(cx + rx * Math.cos(a), cy + ry * Math.sin(a)); });
  const parts = [ell(0, -48, 44, 46), ell(18, -104, 30, 29), [V(-6, -122), V(2, -162), V(22, -128)], [V(14, -126), V(32, -160), V(40, -118)]];
  // 尾巴：二次貝茲的帶狀多邊形，由根部細細往上翹
  const P0 = [36, -18], P1 = [96, -6], P2 = [86, -100], N = 12, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, bx = (1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0], by = (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1];
    const tx = 2 * (1 - t) * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]), ty = 2 * (1 - t) * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
    const len = Math.hypot(tx, ty), nx = -ty / len, ny = tx / len, w = (10 - 7 * t) / 2;
    L.push(V(bx + nx * w, by + ny * w)); R.unshift(V(bx - nx * w, by - ny * w));
  }
  parts.push([...L, ...R]);
  const g = new THREE.Group();
  parts.forEach((pts) => { const m = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), mat); g.add(m); });
  return g;
}

  function renderLabels() {
    labels.replaceChildren(...items(seg).filter((i) => i.k === 'l').map((l) => {

      d.style.left = (l.x * 100) + '%'; d.style.top = (l.y * 100) + '%'; d.style.color = l.color; d.style.borderColor = l.color;

  function openInput(x, y) {

    inp.value = ''; inp.style.left = (Math.min(x, 0.62) * 100) + '%'; inp.style.top = (Math.max(0.05, Math.min(y, 0.95)) * 100) + '%'; inp.style.color = penColor;

  }

    const r = cv.getBoundingClientRect();
    return [Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 10000) / 10000, Math.round(Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) * 10000) / 10000];
  }

  cv.addEventListener('pointercancel', endStroke);

  // 文字輸入：所有按鍵都不往上送，空白鍵、方向鍵、F 不會觸發播放器快捷鍵
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();

  inp.addEventListener('blur', (e) => { if (e.relatedTarget && row.contains(e.relatedTarget)) return; closeInput(); }); // 點色票／按鈕時保留輸入，點別處就取消
  penBtn.onclick = () => setTool(tool === 'pen' ? null : 'pen');
  textBtn.onclick = () => setTool(tool === 'text' ? null : 'text');
  undoBtn.onclick = () => { if (items(seg).pop()) { redraw(); renderLabels(); } };
  clearBtn.onclick = () => { if (items(seg).length && confirm('清除本段所有筆跡與文字標註？')) { items(seg).length = 0; redraw(); renderLabels(); } };
  function applyUi() {

  }
  toggle.onclick = () => { open = !open; uiSet(open); applyUi(); };
  // 全螢幕下不放工具列；進入全螢幕時關閉畫筆，筆跡仍顯示（標註層在全螢幕元素內）

})();
let cur = 0, playing = false, last = 0;
const chap = document.getElementById('chapters');
const btns = SEGS.map((s, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = `${i + 1}・${s.name}`; b.onclick = () => { playerPause(); playerShow(s.a); };
  li.append(b); chap.append(li); return b;
});
function playerShow(t) {
  cur = clamp(t, 0, window.DURATION); scrub.value = cur;
  timeEl.textContent = `${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);
  const i = segIndex(cur); btns.forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
}
function playerTick(now) { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= window.DURATION) { cur = window.DURATION; playerPause(); } playerShow(cur); if (playing) requestAnimationFrame(playerTick); }
function playerPlay() { if (cur >= window.DURATION - 0.05) cur = 0; playing = true; playBtn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(playerTick); }
function playerPause() { playing = false; playBtn.textContent = '播放'; }
playBtn.onclick = () => (playing ? playerPause() : playerPlay());
scrub.oninput = () => { playerPause(); playerShow(Number(scrub.value)); };
document.getElementById('prev').onclick = () => { playerPause(); playerShow(SEGS[segIndex(cur - 0.6)].a); };
document.getElementById('next').onclick = () => { playerPause(); const i = segIndex(cur) + 1; playerShow(i < SEGS.length ? SEGS[i].a : window.DURATION); };
document.getElementById('fs').onclick = () => { const th = document.getElementById('theater'); document.fullscreenElement ? document.exitFullscreen() : th.requestFullscreen?.(); };
addEventListener('keydown', (e) => {
  if (document.documentElement.classList.contains('embed')) return;
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? playerPause() : playerPlay(); }
  else if (e.key === 'ArrowRight') document.getElementById('next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
window.ready.then(() => playerShow(cur));
// 研習平台嵌入契約（postMessage 握手，鍵名 ptt 為相容用）：被嵌入時才啟用
addEventListener('message', (e) => {
  if (e.source !== window.parent || window.parent === window) return;
  const m = e.data;
  if (!m || m.ptt !== 1 || m.type !== 'seek' || typeof m.t !== 'number' || !Number.isFinite(m.t)) return;
  window.seek(m.t);
});
if (window.parent !== window) window.ready.then(() => parent.postMessage({ ptt: 1, type: 'ready', duration: window.DURATION }, '*'));
</script>
