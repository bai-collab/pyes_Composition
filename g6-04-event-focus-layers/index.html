<title>頭尾都回到那一刻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* repo 轉教學動畫網頁｜通用骨架（黑板舞台）。新動畫只改「設定區」與「場景區」。 */
:root{
  --board:#23392f; --board-deep:#1a2b23; --frame:#6e4c31;
  --chalk:#efe9d8; --chalk-dim:#a9b3a6;
  --yellow:#f2c14e; --orange:#e8875b; --blue:#7fb6d9; --green:#8fd18a; --red:#e66a5c;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body)}
/* ===== 播放器版面公版（研習平台頁同一套規則）=====
   1) 播放區 .player（標題列＋舞台＋字幕＋控制列）剛好佔一個視窗高；章節、延伸閱讀、出處在下方，往下捲才看到。
   2) 舞台吃「扣掉標題列、字幕、控制列後的剩餘空間」：.stage-area 是容器查詢容器，.board 用 cqw／cqh 算出 16:9 最大尺寸並置中；
      木框寬度只用 --bw 變數計入（SVG 本身維持 16:9），不得再用固定像素去扣高度。
   3) 進度條列可收合（#toggleSeek），預設收起；收起時舞台自動變大。字幕至少預留兩行，段落切換時舞台不跳動。    4) 標註工具（手寫筆跡＋文字，.annoLayer 掛在 .board 內）：「標註工具 ▸／▾」（#toggleInk）收合一列工具列，預設收起；標註以段落為單位、只存在記憶體；?embed=1 不啟用。 */
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.player{box-sizing:border-box;height:100vh;height:100dvh;padding-block:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.player>header,.player>.controls{flex:none}
.theater{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.theater .caption{align-self:stretch;flex:none}
.stage-area{flex:1 1 0;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:center;container-type:size}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{--bw:14px;box-sizing:border-box;border:var(--bw) solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);flex:none;max-width:100%;
  width:100%;width:min(100cqw, calc((100cqh - 2 * var(--bw)) * 16 / 9 + 2 * var(--bw)))}
/* 全螢幕：theater 本身就是全螢幕元素，沿用同一套規則（舞台吃剩餘空間、字幕預留兩行；字幕字級與行高用 vh／vw） */
.theater:fullscreen{background:var(--board-deep);gap:1.5vh;padding:2vh 2vw;box-sizing:border-box}
.theater:fullscreen .caption{text-align:center;font-size:min(2.4vw,3.2vh);line-height:1.4;min-height:2.8em;max-width:100%}
@media (max-width:640px){.board{--bw:8px}}
/* 內嵌（?embed=1）：只留舞台與字幕，尺寸全用 vh，播放由外層 postMessage 控制（版面公版不套用） */
html.embed body{padding:0;overflow:hidden}
html.embed header,html.embed .controls,html.embed .chapters,html.embed .works,html.embed .note{display:none}
html.embed .wrap{max-width:none;gap:0;padding:0}
html.embed .player,html.embed .stage-area{display:contents}
html.embed .stage-area{container-type:normal}
html.embed .theater{flex:none;gap:1vh}
html.embed .board{width:min(100%, calc(89vh * 16 / 9));border-width:1.4vh}
html.embed .caption{font-size:2.6vh;line-height:1.4;min-height:3.8vh;text-align:center;padding:0 1vh;margin:0}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:3em;margin:0}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
#fs{margin-left:auto}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#toggleSeek[aria-expanded="true"]{border-color:var(--yellow);color:var(--yellow)}
/* 進度條列：獨佔 .controls 的第二列；黃色 6px 粗軌道畫在 #seekMarks（細線＝段落分界），上面疊透明的 range 與 16px 圓拇指 */
.seekrow{display:flex;flex:1 0 100%;align-items:center;gap:12px}
.seekrow[hidden]{display:none}
#seekWrap{position:relative;flex:1 1 200px;min-width:120px;height:20px}
#scrub{position:relative;z-index:1;-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;padding:0;margin:0;border:0;border-radius:0;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:6px;background:transparent}
#scrub::-moz-range-track{height:6px;border:0;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#scrub::-moz-range-thumb{box-sizing:border-box;width:16px;height:16px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#seekMarks{position:absolute;left:8px;right:8px;top:7px;height:6px;border-radius:3px;overflow:hidden;background:var(--yellow);pointer-events:none}
#seekMarks i{position:absolute;top:0;bottom:0;width:1px;background:var(--board-deep)}
#time{flex:none;width:8.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.85rem}
/* 標註工具（手寫筆跡＋文字）：標註層蓋在舞台上，平常 pointer-events:none，只有畫筆／文字啟用時才攔截；?embed=1 不建立 */
.board{position:relative}
.annoLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;--u:1px}
.annoLayer canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none;border-radius:0;aspect-ratio:auto;box-shadow:none}
.annoLayer canvas.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.annoLayer canvas.on.text-mode{cursor:text}
.annoLabels{position:absolute;inset:0;pointer-events:none}
.annoLabel{position:absolute;transform:translateY(-50%);font-family:var(--font-chalk,serif);font-size:calc(34 * var(--u));font-weight:700;line-height:1.25;padding:calc(4 * var(--u)) calc(14 * var(--u));background:rgba(26,43,35,.82);border:calc(2 * var(--u)) solid;border-radius:calc(10 * var(--u));white-space:pre-wrap;max-width:56%;word-break:break-word}
.annoInput{position:absolute;transform:translateY(-50%);box-sizing:border-box;width:max(180px,32%);max-width:92%;font-family:var(--font-chalk,serif);font-size:max(16px,calc(30 * var(--u)));font-weight:700;pointer-events:auto;background:rgba(26,43,35,.95);border:2px dashed var(--yellow,#f2c14e);color:var(--chalk,#efe9d8)}
.annoInput[hidden]{display:none}
#toggleInk[aria-expanded="true"]{border-color:var(--yellow,#f2c14e);color:var(--yellow,#f2c14e)}
/* 工具列：獨佔 .controls 的一整列 */
.annoRow{display:flex;flex:1 0 100%;flex-wrap:wrap;align-items:center;gap:8px 10px}
.annoRow[hidden]{display:none}
.annoSwatches{display:inline-flex;align-items:center;gap:8px}
.annoSwatch{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.annoSwatch[aria-pressed="true"]{border-color:#fff;outline:2px solid var(--board-deep,var(--bg,#1a2b23))}
.annoRow button[aria-pressed="true"]:not(.annoSwatch){border-color:var(--yellow,#f2c14e);color:var(--board-deep,#1a2b23);background:var(--yellow,#f2c14e)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.85rem;padding:.25em .8em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works a{color:var(--chalk);text-underline-offset:3px}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
</style>

<div class="wrap">
  <section class="player" aria-label="動畫播放器">
    <header>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <div class="theater" id="theater">
      <div class="stage-area"><div class="board"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"></svg></div></div>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="controls">
      <button id="prev" type="button">上一段</button>
      <button id="play" type="button">播放</button>
      <button id="next" type="button">下一段</button>
      <button id="toggleSeek" type="button" aria-expanded="false" aria-controls="seekrow">進度條 ▸</button>
      <button id="fs" type="button">全螢幕</button>
      <div class="seekrow" id="seekrow" hidden>
        <div id="seekWrap">
          <input id="scrub" type="range" min="0" max="1" step="0.05" value="0" aria-label="時間軸">
          <div id="seekMarks" aria-hidden="true"></div>
        </div>
        <span id="time"></span>
      </div>
    </div>
  </section>
  <ul class="chapters" id="chapters"></ul>
  <section class="works" aria-labelledby="works-h"><h2 id="works-h">延伸閱讀</h2><ul id="works"></ul></section>
  <p class="note" id="note"></p>
</div>

<script>
'use strict';
// ===================== 設定區（段落與字幕由 timing.json 注入）=====================
// ===== 教學動畫共用圖形（不得與範本播放器或工具重名）=====
const C = { yellow: 'var(--yellow)', blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', orange: 'var(--orange)', purple: '#b9a3e3', chalk: 'var(--chalk)', dim: 'var(--chalk-dim)', deep: 'var(--board-deep)' };
function arrow(x1, y1, x2, y2, color = C.dim, op = 1, both = false, k = 1, dash = '') {
  const ex = lerp(x1, x2, k), ey = lerp(y1, y2, k);
  const ang = Math.atan2(y2 - y1, x2 - x1), h = 16;
  const head = (x, y, a) => `<polygon points="${x},${y} ${x - h * Math.cos(a - 0.45)},${y - h * Math.sin(a - 0.45)} ${x - h * Math.cos(a + 0.45)},${y - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  let g = `<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="4" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (k >= 0.99) { g += head(x2, y2, ang); if (both) g += head(x1, y1, ang + Math.PI); }
  return g + '</g>';
}
// 曲線箭頭：二次貝茲，k 為繪製進度（以 dasharray 截斷）
function curve(x1, y1, cx, cy, x2, y2, color = C.dim, op = 1, k = 1, label = '', lx = 0, ly = 0) {
  const len = 1400;
  let g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="10 9" pathLength="${len}" style="stroke-dashoffset:0"/>`;
  if (k < 0.99) g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" pathLength="${len}" stroke-dasharray="${(len * k).toFixed(1)} ${len}"/>`;
  else {
    const a = Math.atan2(y2 - cy, x2 - cx), h = 16;
    g += `<polygon points="${x2},${y2} ${x2 - h * Math.cos(a - 0.45)},${y2 - h * Math.sin(a - 0.45)} ${x2 - h * Math.cos(a + 0.45)},${y2 - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  }
  if (label) g += txt(lx, ly, label, { c: 't-body', s: 24, f: color, o: k >= 0.99 ? 1 : 0 });
  return g + '</g>';
}
function hframe(x, y, w, h, op, label = '', color = C.yellow, glow = 0, size = 32) {
  return `<g opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="rgba(242,193,78,${0.04 + 0.08 * glow})" stroke="${color}" stroke-width="${4 + 2 * glow}" stroke-dasharray="16 12"/>` +
    (label ? txt(x + 26, y + 44, label, { s: size, w: 1, f: color }) : '') + '</g>';
}
function card(x, y, W, h, op, lines, color = C.chalk) {
  // lines: [[文字, 字級, 顏色, 粗體, 字型類別, 置中]]，依序往下排
  let g = `<g opacity="${op}">${box(x, y, W, h, color, 1, C.deep)}`;
  let yy = y + 14;
  for (const [s, size = 28, f = C.chalk, bold = false, c = 't-chalk', cx = false] of lines) {
    yy += size * 1.25;
    g += txt(cx ? x + W / 2 : x + 24, yy, s, { s: size, f, w: bold, c, a: cx ? 'middle' : 'start' });
    yy += size * 0.3;
  }
  return g + '</g>';
}
function ccard(x, y, w, h, op, title, sub, color = C.chalk, tsize = 32, ssize = 24) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}` +
    txt(x + w / 2, y + h / 2 + (sub ? -6 : tsize * 0.35), title, { a: 'middle', s: tsize, w: 1, f: color }) +
    (sub ? txt(x + w / 2, y + h / 2 + ssize + 8, sub, { a: 'middle', c: 't-body', s: ssize, f: C.dim }) : '') + '</g>';
}
function chip(x, y, w, label, op, color = C.chalk, size = 26, h = 58) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}${txt(x + w / 2, y + h / 2 + size * 0.36, label, { a: 'middle', s: size, f: color })}</g>`;
}
function tick(x, y, s, op, color = C.green) {
  return `<path d="M${x - s} ${y} L${x - s / 3} ${y + s * 0.7} L${x + s} ${y - s * 0.8}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
}
function cross(x, y, s, op, color = C.red) {
  return `<g opacity="${op}" stroke="${color}" stroke-width="12" stroke-linecap="round"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function dot(x, y, r, color, op = 1) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${op}"/>`; }
function underline(x1, x2, y, k, color = C.yellow, op = 1) { return `<line x1="${x1}" y1="${y}" x2="${lerp(x1, x2, k)}" y2="${y}" stroke="${color}" stroke-width="4" opacity="${op}"/>`; }
// 依進度逐一出現：第 i 個元素在 t0 + i*step 開始、花 dur 秒
const stagger = (u, t0, i, step = 0.6, dur = 0.7) => ease(P(u, t0 + i * step, t0 + i * step + dur));

// 六年級記敘文（寫事，進階）第二集：場景只由段內 u（秒）決定。
const META = {
  title: '頭尾都回到那一刻',
  subtitle: '9 段・約 2 分鐘・六年級記敘文（寫事）第二集',
  ariaLabel: '以四塊積木、事件照片、珠串、蝴蝶結和印章，呈現果因果式頭尾兩段如何長肉。',
  note: '出處：楊裕貿研習講義；記事學習單。積木、工作牌、珠子、蝴蝶結、照片、印章是視覺比喻；示範句、短語與情節依講義結構自編。鍵盤操作：空白鍵播放／暫停，左右方向鍵切換段落，F 鍵全螢幕。畫面只由時間決定。',
  works: [],
};

const EFL_BLUE = '#7fb6d9';
const EFL_ORANGE = '#e8875b';
const EFL_RED = '#d9605a';
const EFL_X = [140, 365, 805, 1245];
const EFL_W = [215, 430, 430, 215];
const EFL_COLORS = [EFL_BLUE, EFL_BLUE, EFL_BLUE, EFL_ORANGE];
const eflK = (u, a, b) => ease(P(u, a, b));
const eflO = (v) => Math.max(0, Math.min(1, Number(v) || 0)).toFixed(3);
const eflN = (v) => Number(v).toFixed(1);

function eflTag(op = 1) {
  return '<g opacity="' + eflO(op) + '">' + box(1375, 56, 165, 60, EFL_ORANGE, 1, C.deep) +
    txt(1457, 98, '比喻', { a: 'middle', s: 30, w: 1, f: EFL_ORANGE }) + '</g>';
}

function eflLabel(cx, y, value, size = 30, color = C.chalk, op = 1) {
  if (op <= 0.001) return '';
  return txt(cx, y, value, { a: 'middle', s: size, w: 1, f: color, o: op });
}

function eflFitLabel(cx, y, value, size, color, op, maxWidth) {
  if (op <= 0.001) return '';
  return '<text x="' + eflN(cx) + '" y="' + eflN(y) + '" class="t-chalk" font-size="' + size +
    '" font-weight="700" text-anchor="middle" fill="' + color + '" opacity="' + eflO(op) +
    '" textLength="' + eflN(maxWidth) + '" lengthAdjust="spacingAndGlyphs">' + esc(value) + '</text>';
}

function eflTextByChar(value, cx, y, size, color = C.chalk, op = 1) {
  const chars = Array.from(value);
  return chars.map((ch, i) => txt(cx + (i - (chars.length - 1) / 2) * size, y, ch, {
    a: 'middle', s: size, w: 1, f: color, o: op,
  })).join('');
}

function eflType(value, u, cx, y, size, color, start, end, op = 1) {
  if (u <= start) return '';
  const chars = Array.from(value);
  const count = Math.min(chars.length, Math.ceil(P(u, start, end) * chars.length));
  if (count <= 0) return '';
  return eflTextByChar(chars.slice(0, count).join(''), cx, y, size, color, op);
}

function eflTypeFixed(value, u, cx, y, size, color, start, end, op = 1) {
  if (u <= start) return '';
  const chars = Array.from(value);
  const count = Math.min(chars.length, Math.ceil(P(u, start, end) * chars.length));
  if (count <= 0) return '';
  return chars.slice(0, count).map((ch, i) => txt(cx + (i - (chars.length - 1) / 2) * size, y, ch, {
    a: 'middle', s: size, w: 1, f: color, o: op,
  })).join('');
}

function eflLine(x1, y1, x2, y2, color = C.chalk, width = 5, op = 1, dash = '') {
  if (op <= 0.001) return '';
  return '<line x1="' + eflN(x1) + '" y1="' + eflN(y1) + '" x2="' + eflN(x2) + '" y2="' + eflN(y2) +
    '" fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linecap="round" opacity="' +
    eflO(op) + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';
}

function eflBlock(x, y, w, h, color, op = 1, dashed = false) {
  if (op <= 0.001 || w <= 2 || h <= 2) return '';
  if (dashed) return '<g opacity="' + eflO(op) + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="14" fill="rgba(239,233,216,.012)" stroke="' + color + '" stroke-width="5" stroke-dasharray="14 10"/></g>';
  let g = '<g opacity="' + eflO(op) + '">';
  const n = Math.max(2, Math.floor(w / 130));
  for (let i = 0; i < n; i++) {
    const cx = x + w * (i + 0.5) / n;
    g += '<rect x="' + eflN(cx - 20) + '" y="' + eflN(y - 11) + '" width="40" height="13" rx="6" fill="' + color + '"/>';
  }
  return g + '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="14" fill="' + color + '" fill-opacity=".22" stroke="' + C.chalk + '" stroke-width="4"/></g>';
}

function eflBlockGlow(x, y, w, h, op = 1) {
  const pad = 10;
  const opacity = eflO(Math.min(0.25, Math.max(0, op)));
  return '<rect x="' + (x - pad) + '" y="' + (y - pad) + '" width="' + (w + pad * 2) + '" height="' + (h + pad * 2) +
    '" rx="18" fill="rgba(242,193,78,.22)" opacity="' + opacity + '"/>';
}

function eflCardFrame(x, y, w, h, op = 1, dashed = false, stroke = C.chalk) {
  if (op <= 0.001) return '';
  if (dashed) return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="18" fill="rgba(239,233,216,.012)" stroke="' + stroke + '" stroke-width="4" stroke-dasharray="13 9" opacity="' + eflO(op) + '"/>';
  return '<g opacity="' + eflO(op) + '">' + box(x, y, w, h, stroke, 1, C.deep) + '</g>';
}

function eflBead(cx, cy, r = 30, op = 1, dashed = false) {
  if (op <= 0.002) return '';
  const fill = dashed ? 'none' : EFL_BLUE;
  const dash = dashed ? '8 7' : '';
  return '<g opacity="' + eflO(op) + '"><circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(r) +
    '" fill="' + fill + '" stroke="' + EFL_BLUE + '" stroke-width="4"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>' +
    (dashed ? '' : '<ellipse cx="' + eflN(cx - r * 0.35) + '" cy="' + eflN(cy - r * 0.4) + '" rx="' + eflN(r * 0.25) +
      '" ry="' + eflN(r * 0.14) + '" fill="#fff" opacity=".55" transform="rotate(-35 ' + eflN(cx - r * 0.35) + ' ' +
      eflN(cy - r * 0.4) + ')"/>') + '</g>';
}

function eflBow(cx, cy, sc = 1, op = 1, dashed = false) {
  if (op <= 0.002 || sc <= 0.01) return '';
  const w = 64 * sc, h = 43 * sc, knot = 19 * sc;
  const fill = dashed ? 'none' : EFL_ORANGE, dash = dashed ? ' stroke-dasharray="8 7"' : '';
  return '<g opacity="' + eflO(op) + '"><polygon points="' + eflN(cx - 7 * sc) + ',' + eflN(cy) + ' ' +
    eflN(cx - w) + ',' + eflN(cy - h) + ' ' + eflN(cx - w) + ',' + eflN(cy + h) + '" fill="' + fill +
    '" stroke="' + EFL_ORANGE + '" stroke-width="4" stroke-linejoin="round"' + dash + '/><polygon points="' +
    eflN(cx + 7 * sc) + ',' + eflN(cy) + ' ' + eflN(cx + w) + ',' + eflN(cy - h) + ' ' + eflN(cx + w) +
    ',' + eflN(cy + h) + '" fill="' + fill + '" stroke="' + EFL_ORANGE + '" stroke-width="4" stroke-linejoin="round"' +
    dash + '/><circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(knot) + '" fill="' +
    (dashed ? 'none' : '#c96a40') + '" stroke="' + EFL_ORANGE + '" stroke-width="4"' + dash + '/></g>';
}

function eflThread(x1, x2, y, op = 1, dashed = false) {
  return eflLine(x1, y, x2, y, dashed ? C.dim : C.chalk, 5, op, dashed ? '13 12' : '');
}

function eflGlow(cx, cy, rx = 70, ry = 55, op = 0.5) {
  if (op <= 0.001) return '';
  return '<g opacity="' + eflO(op) + '"><ellipse cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" rx="' + eflN(rx) +
    '" ry="' + eflN(ry) + '" fill="rgba(242,193,78,.18)"/><ellipse cx="' + eflN(cx) + '" cy="' + eflN(cy) +
    '" rx="' + eflN(rx - 12) + '" ry="' + eflN(ry - 10) + '" fill="none" stroke="' + C.yellow + '" stroke-width="5"/></g>';
}

function eflStamp(cx, cy, r, label, op = 1, active = false, dashed = false) {
  if (op <= 0.001 || r <= 1) return '';
  const col = active ? C.yellow : C.chalk;
  if (dashed) return '<circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(r) +
    '" fill="none" stroke="' + col + '" stroke-width="5" stroke-dasharray="11 9" opacity="' + eflO(op) + '"/>';
  const labelY = cy + r + 39;
  return '<g opacity="' + eflO(op) + '"><circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(r) +
    '" fill="' + C.deep + '" stroke="' + col + '" stroke-width="5"/><path d="M' + eflN(cx - r * 0.38) + ' ' +
    eflN(cy - 7) + ' H' + eflN(cx + r * 0.38) + ' M' + eflN(cx - r * 0.38) + ' ' + eflN(cy + 8) + ' H' +
    eflN(cx + r * 0.38) + '" stroke="' + col + '" stroke-width="5" stroke-linecap="round"/>' +
    txt(cx, labelY, label, { a: 'middle', s: 34, w: 1, f: col }) + '</g>';
}

function eflSeal(cx, cy, r, label, op = 1) {
  if (op <= 0.001) return '';
  return '<g opacity="' + eflO(op) + '"><circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(r) +
    '" fill="' + C.deep + '" stroke="' + C.yellow + '" stroke-width="5"/>' +
    txt(cx, cy + 11, label, { a: 'middle', s: 30, w: 1, f: C.yellow }) + '</g>';
}

function eflLens(cx, cy, r = 45, op = 1, dashed = false, handleUp = false) {
  if (op <= 0.01 || r <= 1) return '';
  const dash = dashed ? '11 9' : '';
  const sy = handleUp ? -1 : 1;
  return '<g opacity="' + eflO(op) + '"><circle cx="' + eflN(cx) + '" cy="' + eflN(cy) + '" r="' + eflN(r) +
    '" fill="rgba(242,193,78,.045)" stroke="' + C.yellow + '" stroke-width="8"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/><path d="M' + eflN(cx + r * 0.68) + ' ' +
    eflN(cy + sy * r * 0.68) + ' L' + eflN(cx + r * 1.28) + ' ' + eflN(cy + sy * r * 1.28) +
    '" stroke="' + C.yellow + '" stroke-width="17" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') +
    '/><path d="M' + eflN(cx + r * 0.8) + ' ' + eflN(cy + sy * r * 0.8) + ' L' + eflN(cx + r * 1.26) + ' ' +
    eflN(cy + sy * r * 1.26) + '" stroke="' + C.chalk + '" stroke-width="4" stroke-linecap="round"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></g>';
}

function eflStar(cx, cy, r, op = 1, dashed = false) {
  if (op <= 0.01 || r <= 1) return '';
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.46 : r;
    pts.push(eflN(cx + Math.cos(a) * rr) + ',' + eflN(cy + Math.sin(a) * rr));
  }
  return '<polygon points="' + pts.join(' ') + '" fill="' + (dashed ? 'none' : 'rgba(242,193,78,.3)') +
    '" stroke="' + C.yellow + '" stroke-width="5" stroke-linejoin="round" opacity="' + eflO(op) +
    '"' + (dashed ? ' stroke-dasharray="8 7"' : '') + '/>';
}

function eflHeart(cx, cy, scale = 1, op = 1) {
  if (op <= 0.01 || scale <= 0.01) return '';
  return '<path transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) +
    ')" d="M0 38 C-13 21 -48 -2 -48 -24 C-48 -51 -15 -55 0 -31 C15 -55 48 -51 48 -24 C48 -2 13 21 0 38Z" ' +
    'fill="rgba(232,135,91,.22)" stroke="' + EFL_ORANGE + '" stroke-width="6" opacity="' + eflO(op) + '"/>';
}

function eflHuman(cx, cy, scale = 1, op = 1, raiseHand = false) {
  const arm = raiseHand ? 'M-5 -10 L-34 -32 M5 -10 L31 -25 L38 -60' : 'M-5 -10 L-36 14 M5 -10 L36 14';
  return '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) + ')" opacity="' +
    eflO(op) + '" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-50" r="22" fill="rgba(240,217,189,.2)" stroke="' +
    C.chalk + '" stroke-width="5"/><path d="M-9 -53 Q0 -61 9 -53" fill="none" stroke="' + C.chalk +
    '" stroke-width="3"/><path d="M0 -28 L0 38 ' + arm + ' M0 38 L-26 76 M0 38 L26 76" fill="none" stroke="' +
    C.chalk + '" stroke-width="8"/><path d="M-18 -20 Q0 -29 18 -20 L22 28 Q0 39 -22 28Z" fill="rgba(127,182,217,.2)" stroke="' +
    EFL_BLUE + '" stroke-width="4"/></g>';
}

function eflDomino(cx, baseY, w, h, angle = 0, op = 1, dashed = false) {
  if (op <= 0.001) return '';
  return '<g transform="translate(' + eflN(cx) + ' ' + eflN(baseY) + ') rotate(' + eflN(angle) +
    ')" opacity="' + eflO(op) + '"><rect x="' + eflN(-w / 2) + '" y="' + eflN(-h) + '" width="' + eflN(w) +
    '" height="' + eflN(h) + '" rx="11" fill="' + (dashed ? 'none' : 'rgba(232,135,91,.13)') +
    '" stroke="' + (dashed ? C.chalk : C.orange) + '" stroke-width="5"' +
    (dashed ? ' stroke-dasharray="12 8"' : '') + '/>' +
    (dashed ? '' : '<circle cx="0" cy="' + eflN(-h * 0.72) + '" r="7" fill="' + C.orange +
      '"/><circle cx="0" cy="' + eflN(-h * 0.3) + '" r="7" fill="' + C.orange + '"/>') + '</g>';
}

function eflBell(cx, cy, scale = 1, angle = 0, opacity = 1) {
  return '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) + ') rotate(' +
    eflN(angle) + ')" opacity="' + eflO(opacity) + '" stroke-linejoin="round"><path d="M-37 33 Q-31 20 -29 -8 Q-26 -43 0 -52 Q26 -43 29 -8 Q31 20 37 33 Z" fill="rgba(239,233,216,.1)" stroke="' +
    C.chalk + '" stroke-width="5"/><path d="M-43 34 L43 34 M-12 44 Q0 55 12 44" fill="none" stroke="' + C.chalk +
    '" stroke-width="6" stroke-linecap="round"/><circle cx="0" cy="-57" r="7" fill="' + C.yellow + '"/></g>';
}

function eflMirror(cx, cy, scale = 1, op = 1) {
  return '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) + ')" opacity="' +
    eflO(op) + '" fill="none" stroke="' + C.chalk + '" stroke-linejoin="round"><ellipse cx="0" cy="-5" rx="30" ry="42" stroke-width="5"/>' +
    '<path d="M0 37 L0 61 M-18 62 H18" stroke-width="5"/><path d="M-14 -20 Q0 -30 14 -20" stroke="' + C.yellow +
    '" stroke-width="4"/></g>';
}

function eflMic(cx, cy, scale = 1, op = 1) {
  return '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) + ')" opacity="' +
    eflO(op) + '" stroke-linecap="round" stroke-linejoin="round"><rect x="-16" y="-43" width="32" height="54" rx="16" fill="rgba(127,182,217,.18)" stroke="' +
    C.chalk + '" stroke-width="5"/><path d="M-27 -8 Q-27 28 0 28 Q27 28 27 -8 M0 28 V47 M-22 48 H22" fill="none" stroke="' +
    C.chalk + '" stroke-width="5"/><path d="M-9 -28 H9 M-9 -14 H9" stroke="' + EFL_BLUE + '" stroke-width="4"/></g>';
}

function eflPhoto(cx, cy, scale = 1, op = 1, dashed = false) {
  if (op <= 0.001 || scale <= 0.001) return '';
  if (dashed) return '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) +
    ')" opacity="' + eflO(op) + '"><rect x="-90" y="-105" width="180" height="210" fill="none" stroke="' +
    C.chalk + '" stroke-width="6" stroke-dasharray="14 10"/></g>';
  let g = '<g transform="translate(' + eflN(cx) + ' ' + eflN(cy) + ') scale(' + eflN(scale) + ')" opacity="' +
    eflO(op) + '"><rect x="-90" y="-105" width="180" height="210" fill="#f4f0e6" stroke="' + C.chalk +
    '" stroke-width="6"/><rect x="-72" y="-88" width="144" height="132" fill="#26382f" stroke="' + EFL_BLUE + '" stroke-width="3"/>';
  g += eflMic(-48, -24, 0.36, 1);
  for (let i = 0; i < 5; i++) {
    const ex = 4 + i * 14;
    g += '<ellipse cx="' + ex + '" cy="-58" rx="6" ry="4" fill="#efe9d8"/><circle cx="' + ex + '" cy="-58" r="2.2" fill="#23392f"/>';
  }
  g += '<path d="M17 4 L56 -2 L63 30 L24 37 Z" fill="#efe9d8" stroke="#b2aa96" stroke-width="2"/>' +
    '<path d="M24 13 L53 8 M26 21 L55 16 M27 29 L47 25" stroke="#7a867d" stroke-width="2"/>' +
    '<path d="M-2 39 Q12 28 26 25 L36 34 L20 45 L5 48 Z" fill="rgba(240,217,189,.7)" stroke="#efe9d8" stroke-width="3"/>' +
    '<path d="M-64 67 H64" stroke="#b2aa96" stroke-width="3"/></g>';
  return g;
}

function eflMomentPoints(x, y, w, h) {
  const ix = x + 14, iy = y + 14, iw = w - 28, ih = h - 84;
  return [[ix + iw * 0.25, iy + ih * 0.45], [ix + iw * 0.65, iy + ih * 0.28], [ix + iw * 0.62, iy + ih * 0.70]];
}

function eflMoment(x, y, w, h, glow = [0, 0, 0], op = 1) {
  if (op <= 0.001) return '';
  const ix = x + 14, iy = y + 14, iw = w - 28, ih = h - 84;
  const points = eflMomentPoints(x, y, w, h);
  const micX = points[0][0], micY = points[0][1];
  const eyesX = points[1][0], eyesY = points[1][1];
  const handX = points[2][0], handY = points[2][1];
  let g = '<g opacity="' + eflO(op) + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" fill="#f4f0e6" stroke="' + C.chalk + '" stroke-width="6"/><rect x="' + ix + '" y="' + iy + '" width="' + iw +
    '" height="' + ih + '" fill="#26382f" stroke="' + EFL_BLUE + '" stroke-width="3"/>';
  g += eflGlow(micX, micY, 30, 55, glow[0] || 0);
  g += eflGlow(eyesX, eyesY, 92, 27, glow[1] || 0);
  g += eflGlow(handX, handY, 62, 52, glow[2] || 0);
  g += eflMic(micX, micY, 0.72, 1);
  for (let i = 0; i < 5; i++) {
    const ex = eyesX + (i - 2) * 22;
    g += '<ellipse cx="' + eflN(ex) + '" cy="' + eflN(eyesY) + '" rx="9" ry="6" fill="#efe9d8"/>' +
      '<circle cx="' + eflN(ex) + '" cy="' + eflN(eyesY) + '" r="3" fill="#23392f"/>';
  }
  g += '<path d="M' + eflN(handX - 39) + ' ' + eflN(handY - 33) + ' L' + eflN(handX + 36) + ' ' +
    eflN(handY - 43) + ' L' + eflN(handX + 48) + ' ' + eflN(handY + 29) + ' L' + eflN(handX - 27) +
    ' ' + eflN(handY + 40) + ' Z" fill="#efe9d8" stroke="#b2aa96" stroke-width="4"/>' +
    '<path d="M' + eflN(handX - 27) + ' ' + eflN(handY - 16) + ' L' + eflN(handX + 28) + ' ' +
    eflN(handY - 23) + ' M' + eflN(handX - 24) + ' ' + eflN(handY - 2) + ' L' + eflN(handX + 31) +
    ' ' + eflN(handY - 9) + ' M' + eflN(handX - 21) + ' ' + eflN(handY + 12) + ' L' + eflN(handX + 8) +
    ' ' + eflN(handY + 8) + '" stroke="#7a867d" stroke-width="3"/>' +
    '<path d="M' + eflN(handX - 49) + ' ' + eflN(handY + 42) + ' Q' + eflN(handX - 31) + ' ' +
    eflN(handY + 10) + ' ' + eflN(handX - 12) + ' ' + eflN(handY + 27) + ' L' + eflN(handX + 7) +
    ' ' + eflN(handY + 43) + ' L' + eflN(handX + 25) + ' ' + eflN(handY + 30) + ' Q' + eflN(handX + 40) +
    ' ' + eflN(handY + 25) + ' ' + eflN(handX + 43) + ' ' + eflN(handY + 40) + ' L' + eflN(handX + 9) +
    ' ' + eflN(handY + 61) + ' L' + eflN(handX - 36) + ' ' + eflN(handY + 60) + ' Z" fill="rgba(240,217,189,.75)" stroke="' +
    C.chalk + '" stroke-width="4"/><path d="M' + eflN(x + 36) + ' ' + eflN(y + h - 34) + ' H' +
    eflN(x + w - 36) + '" stroke="#b2aa96" stroke-width="3"/></g>';
  return g;
}

function eflPulse(u, start, end) {
  const inK = eflK(u, start, start + 0.12);
  const outK = 1 - eflK(u, end - 0.12, end);
  return Math.max(0, Math.min(inK, outK));
}

function eflFlash(u, start) {
  const inK = eflK(u, start, start + 0.1);
  const outK = 1 - eflK(u, start + 0.4, start + 0.5);
  return Math.max(0, Math.min(inK, outK));
}

function eflPaint(svg) {
  return svg.replace(/font-size="24"/g, 'font-size="26"')
    .replace(/<text ([^>]*?)fill="([^"]+)"/g, '<text $1style="fill:$2" fill="$2"');
}

function s1(u) {
  let g = head(u, '開場', '從骨架長出來') + eflTag(1);
  for (let i = 0; i < 4; i++) {
    const k = eflK(u, 0.2 + i * 0.28, 0.85 + i * 0.28);
    g += eflBlock(EFL_X[i], lerp(170, 260, k), EFL_W[i], 190, EFL_COLORS[i], k);
  }
  const glow = eflK(u, 5.5, 6.5);
  g += eflBlockGlow(140, 260, 215, 190, glow) + eflBlockGlow(1245, 260, 215, 190, glow);
  const roleK = eflK(u, 1.5, 2.5);
  g += eflFitLabel(247, 315, '先寫那一刻', 34, C.chalk, roleK, 194);
  g += eflLabel(580, 315, '為何特別：起因', 34, C.chalk, roleK);
  g += eflLabel(1020, 315, '為何特別：經過', 34, C.chalk, roleK);
  g += eflLabel(1352, 315, '結果和感想', 34, C.chalk, roleK);
  const iconStarts = [2.0, 2.4, 2.8, 3.2];
  const iconEnds = [2.45, 2.9, 3.35, 3.5];
  for (let i = 0; i < 4; i++) {
    const k = eflK(u, iconStarts[i], iconEnds[i]);
    const y = lerp(235, 390, k);
    if (i === 0) g += eflPhoto(247, y, 0.4, k);
    if (i === 1) g += eflHuman(580, y, 0.52, k, true);
    if (i === 2) g += eflDomino(984, y + 28, 20, 62, 0, k) + eflMirror(1060, y, 0.58, k);
    if (i === 3) g += eflBell(1325, y, 0.58, 0, k) + eflHeart(1388, y + 8, 0.42, k);
  }
  const phrases = [
    [247, 500, '麥克風一響', 3.5], [247, 542, '腿在發抖', 3.8],
    [580, 500, '全班只選我', 4.0], [1020, 500, '每天對鏡練', 4.2],
    [1352, 500, '台下掌聲', 4.4], [1352, 542, '更有自信', 4.6],
  ];
  phrases.forEach(([x, y, value, start]) => {
    g += eflType(value, u, x, y, 30, C.yellow, start, start + 0.45);
  });
  g += eflType('長肉', u, 247, 650, 36, C.yellow, 6.5, 7.5);
  g += eflType('長肉', u, 1352, 650, 36, C.yellow, 6.5, 7.5);
  g += '<path d="M247 690 Q800 870 1352 690" fill="none" stroke="' + C.yellow +
    '" stroke-width="4" stroke-dasharray="14 12" opacity="' + eflO(eflK(u, 7.5, 8.5)) + '"/>';
  return eflPaint(g);
}

function s2(u) {
  let g = head(u, '第一段', '那一刻：看到聽到') + eflTag(1);
  const blockK = eflK(u, 0.2, 0.8);
  g += eflBlock(140, 205, 300, 64, EFL_BLUE, blockK);
  g += eflLabel(290, 247, '先寫那一刻', 34, C.chalk, blockK);
  const points = eflMomentPoints(170, 300, 320, 330);
  const starts = [1.0, 3.0, 5.0];
  const targets = [700, 880, 1060];
  const phrases = ['麥克風一響', '全場安靜', '手心冒汗'];
  const glows = starts.map((start) => eflPulse(u, start, start + 0.6));
  g += eflMoment(170, 300, 320, 330, glows, eflK(u, 0.3, 1.0));
  g += eflThread(600, lerp(600, 1420, eflK(u, 0.8, 1.3)), 720, eflK(u, 0.8, 1.3));
  for (let i = 0; i < 3; i++) {
    const start = starts[i], move = eflK(u, start, start + 0.8);
    if (u > start) {
      g += eflBead(lerp(points[i][0], targets[i], move), lerp(points[i][1], 720, move), 34, 1);
    }
    g += eflType(phrases[i], u, targets[i], 800, 30, C.yellow, start + 0.8, start + 1.15);
  }
  const labelK = eflK(u, 7.0, 8.0);
  g += eflCardFrame(760, 580, 240, 60, labelK, false, EFL_BLUE);
  g += eflLabel(880, 620, '看到聽到', 34, EFL_BLUE, labelK);
  g += '<path d="M690 660 Q880 690 1070 660" fill="none" stroke="' + C.yellow +
    '" stroke-width="5" stroke-linecap="round" opacity="' + eflO(labelK) + '"/>';
  return eflPaint(g);
}

function s3(u) {
  let g = head(u, '第一段', '最後寫心情') + eflTag(1);
  g += eflMoment(170, 300, 320, 330, [0, 0, 0], 1);
  g += eflThread(600, 1420, 720, 1);
  const xs = [700, 880, 1060];
  ['麥克風一響', '全場安靜', '手心冒汗'].forEach((value, i) => {
    g += eflBead(xs[i], 720, 34, 1);

// ===================== 工具（通常不用改）=====================
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const P = (u, a, b) => clamp((u - a) / (b - a), 0, 1);           // u 在 [a,b] 的進度 0–1
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); } // 固定種子亂數
function txt(x, y, s, o = {}) {
  const a = o.a || 'start', size = o.s || 32, fill = o.f || 'var(--chalk)', op = o.o ?? 1, w = o.w ? 700 : 400, cls = o.c || 't-chalk';
  return `<text x="${x}" y="${y}" class="${cls}" font-size="${size}" font-weight="${w}" text-anchor="${a}" fill="${fill}" opacity="${op}">${esc(s)}</text>`;
}
function box(x, y, w, h, stroke = 'var(--chalk)', op = 1, fill = 'none') {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${fill}" stroke="${stroke}" stroke-width="3" opacity="${op}"/>`;
}
function head(u, kicker, title) {
  const o = ease(P(u, 0, 0.8));
  return txt(80, 90, kicker, { c: 't-body', s: 24, f: 'var(--chalk-dim)', o }) + txt(80, 150, title, { s: 50, w: 1, o });
}

let acc = 0; SEGS.forEach((s) => { s.a = acc; acc += s.len; s.b = acc; });
window.DURATION = acc;
window.SEGS = SEGS.map(({ len, grp, name, cap, a, b }) => ({ len, grp, name, cap, a, b }));
const stage = document.getElementById('stage'), capEl = document.getElementById('caption');
const segIndex = (t) => { for (let i = 0; i < SEGS.length; i++) if (t < SEGS[i].b) return i; return SEGS.length - 1; };
window.seek = async function (t) {
  t = clamp(Number(t) || 0, 0, window.DURATION);
  const i = segIndex(t), s = SEGS[i];
  const u = t - s.a;
  // 段落切換時淡入淡出（只由 t 決定）
  const fade = Math.min(P(u, 0, 0.35), i === SEGS.length - 1 ? 1 : 1 - P(u, s.len - 0.35, s.len));
  stage.innerHTML = `<g opacity="${fade.toFixed(3)}">${s.scene(u)}</g>` +
    txt(1520, 870, `${i + 1} / ${SEGS.length}・${s.grp}・${s.name}`, { a: 'end', c: 't-body', s: 18, f: 'var(--chalk-dim)' });
  capEl.innerHTML = s.cap; // 字幕只來自本檔 SEGS（作者撰寫、只含 <b>）
  return true;
};

// 進度條列收合：預設收起；只有獨立播放（非 embed）才讀寫 localStorage 的 UI 狀態，embed 一律不碰；不可用時只留在記憶體

playerApplyUi();
// ===== 標註工具（手寫筆跡＋文字；以段落為單位、只存在記憶體、不送網路）=====
// 與研習平台頁同一套操作：畫筆、文字、5 色色票、收回上一筆、清除本段標註；「標註工具 ▸／▾」可收合（預設收起，鍵 anim.ui.ink）。
// ?embed=1 完全不啟用（研習平台自己有標註）。座標一律存 0–1 的相對位置，舞台縮放或長寬比改變時筆跡仍落在同一處。
(() => {
  if (document.documentElement.classList.contains('embed')) return;
  const stageEl = document.getElementById('stage') || document.getElementById('c');
  const ctl = document.querySelector('.controls') || document.getElementById('bar');
  if (!stageEl || !ctl || typeof window.seek !== 'function') return;
  const COLORS = ['#efe9d8', '#f2c14e', '#e8875b', '#7fb6d9', '#8fd18a'];
  const ends = typeof SEGS !== 'undefined' ? SEGS.map((s) => s.b) : TIMING.map((s) => s.end);
  const segOf = (t) => { for (let i = 0; i < ends.length; i++) if (t < ends[i]) return i; return ends.length - 1; };
  const uiGet = () => { try { return localStorage.getItem('anim.ui.ink') === '1'; } catch { return false; } };
  const uiSet = (v) => { try { localStorage.setItem('anim.ui.ink', v ? '1' : '0'); } catch { /* 不可用時只留在記憶體 */ } };
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
  const store = new Map(); // 段落索引 → [{k:'s',color,pts} | {k:'l',x,y,text,color}]（依畫下順序）
  const items = (i) => { let a = store.get(i); if (!a) store.set(i, (a = [])); return a; };
  let seg = 0, tool = null, penColor = COLORS[1], drawing = null, labelAt = null, open = uiGet();

  // 標註層：有 .board 就掛在木框內（與 SVG 同尺寸）；沒有（如純 canvas 舞台）就掛在舞台父層並追蹤舞台矩形
  const board = stageEl.closest('.board'), host = board || stageEl.parentElement;
  if (!board) host.style.position = 'relative';
  const layer = mk('div', 'annoLayer'), cv = mk('canvas'), labels = mk('div', 'annoLabels'), inp = mk('input', 'annoInput');
  cv.setAttribute('aria-label', '標註區');
  inp.type = 'text'; inp.maxLength = 60; inp.hidden = true; inp.placeholder = '輸入文字，按 Enter 放上；Esc 取消'; inp.setAttribute('aria-label', '文字標註');
  layer.append(cv, labels, inp); host.append(layer);
  const ctx = cv.getContext('2d');

  // 工具列（控制列第三列）與切換鈕
  const toggle = mk('button', '', '標註工具 ▸'), row = mk('div', 'annoRow');
  toggle.id = 'toggleInk'; toggle.type = 'button'; toggle.setAttribute('aria-controls', 'annoTools'); toggle.setAttribute('aria-expanded', 'false');
  row.id = 'annoTools'; row.hidden = true;
  const penBtn = mk('button', '', '畫筆'), textBtn = mk('button', '', '文字'), sw = mk('span', 'annoSwatches'), undoBtn = mk('button', '', '收回上一筆'), clearBtn = mk('button', '', '清除本段標註');
  for (const b of [penBtn, textBtn, undoBtn, clearBtn]) b.type = 'button';
  penBtn.setAttribute('aria-pressed', 'false'); textBtn.setAttribute('aria-pressed', 'false');
  const swBtns = COLORS.map((c, i) => {
    const b = mk('button', 'annoSwatch'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', `顏色 ${i + 1}`); b.setAttribute('aria-pressed', c === penColor ? 'true' : 'false');
    b.onclick = () => { penColor = c; swBtns.forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); if (labelAt) { inp.style.color = c; inp.focus(); } else if (!tool) setTool('pen'); };
    sw.append(b); return b;
  });
  row.append(penBtn, textBtn, sw, undoBtn, clearBtn);
  const seekToggle = document.getElementById('toggleSeek');
  if (seekToggle && seekToggle.parentNode === ctl) seekToggle.after(toggle); else ctl.append(toggle);
  ctl.append(row);

  function fit() {
    if (!board) { layer.style.inset = 'auto'; Object.assign(layer.style, { left: stageEl.offsetLeft + 'px', top: stageEl.offsetTop + 'px', width: stageEl.offsetWidth + 'px', height: stageEl.offsetHeight + 'px' }); }
    const w = layer.clientWidth, h = layer.clientHeight, d = window.devicePixelRatio || 1;
    layer.style.setProperty('--u', (w / 1600) + 'px');
    cv.width = Math.max(1, Math.round(w * d)); cv.height = Math.max(1, Math.round(h * d));
    redraw();
  }
  function strokePath(s) {
    const p = s.pts, W = cv.width, H = cv.height, d = W / (layer.clientWidth || W);
    if (p.length < 4) return;
    ctx.strokeStyle = s.color; ctx.lineWidth = Math.max(2 * d, 5 * W / 1600); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p[0] * W, p[1] * H);
    for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * W, p[i + 1] * H);
    ctx.stroke();
  }
  function redraw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const it of items(seg)) if (it.k === 's') strokePath(it);
    if (drawing && drawing.seg === seg) strokePath(drawing);
  }
  function renderLabels() {
    labels.replaceChildren(...items(seg).filter((i) => i.k === 'l').map((l) => {
      const d = mk('div', 'annoLabel', l.text);
      d.style.left = (l.x * 100) + '%'; d.style.top = (l.y * 100) + '%'; d.style.color = l.color; d.style.borderColor = l.color;
      return d;
    }));
  }
  function setTool(t) {
    tool = t;
    penBtn.setAttribute('aria-pressed', t === 'pen' ? 'true' : 'false');
    textBtn.setAttribute('aria-pressed', t === 'text' ? 'true' : 'false');
    cv.classList.toggle('on', !!t); cv.classList.toggle('text-mode', t === 'text');
    if (t !== 'text') closeInput();
  }
  function openInput(x, y) {
    labelAt = { x, y, seg };
    inp.value = ''; inp.style.left = (Math.min(x, 0.62) * 100) + '%'; inp.style.top = (Math.max(0.05, Math.min(y, 0.95)) * 100) + '%'; inp.style.color = penColor;
    inp.hidden = false; requestAnimationFrame(() => inp.focus());
  }
  function closeInput() { inp.hidden = true; labelAt = null; }
  function norm(e) {
    const r = cv.getBoundingClientRect();
    return [Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 10000) / 10000, Math.round(Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) * 10000) / 10000];
  }
  function endStroke() {
    if (!drawing) return;
    const s = drawing; drawing = null;
    if (s.pts.length === 2) s.pts.push(s.pts[0] + 1 / 1600, s.pts[1] + 1 / 900); // 點一下也留下一個點
    items(s.seg).push(s);
    if (s.seg === seg) redraw();
  }
  cv.addEventListener('pointerdown', (e) => {
    if (!tool) return;
    e.preventDefault();
    const [x, y] = norm(e);
    if (tool === 'text') { openInput(x, y); return; }
    cv.setPointerCapture(e.pointerId);
    drawing = { k: 's', seg, color: penColor, pts: [x, y] };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const [x, y] = norm(e), p = drawing.pts, r = cv.getBoundingClientRect();
    if (Math.hypot((x - p[p.length - 2]) * r.width, (y - p[p.length - 1]) * r.height) < 3 || p.length >= 800) return;
    p.push(x, y); redraw();
  });
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);
  cv.addEventListener('click', (e) => e.stopPropagation()); // 全螢幕「點畫面播放／暫停」不被標註動作觸發
  // 文字輸入：所有按鍵都不往上送，空白鍵、方向鍵、F 不會觸發播放器快捷鍵
  inp.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      const text = inp.value.trim();
      if (text && labelAt) { items(labelAt.seg).push({ k: 'l', x: labelAt.x, y: labelAt.y, text, color: penColor }); if (labelAt.seg === seg) renderLabels(); }
      closeInput();
    } else if (e.key === 'Escape') closeInput();
  });
  inp.addEventListener('keyup', (e) => e.stopPropagation());
  inp.addEventListener('blur', (e) => { if (e.relatedTarget && row.contains(e.relatedTarget)) return; closeInput(); }); // 點色票／按鈕時保留輸入，點別處就取消
  penBtn.onclick = () => setTool(tool === 'pen' ? null : 'pen');
  textBtn.onclick = () => setTool(tool === 'text' ? null : 'text');
  undoBtn.onclick = () => { if (items(seg).pop()) { redraw(); renderLabels(); } };
  clearBtn.onclick = () => { if (items(seg).length && confirm('清除本段所有筆跡與文字標註？')) { items(seg).length = 0; redraw(); renderLabels(); } };
  function applyUi() {
    row.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? '標註工具 ▾' : '標註工具 ▸';
    if (!open) setTool(null);
  }
  toggle.onclick = () => { open = !open; uiSet(open); applyUi(); };
  // 全螢幕下不放工具列；進入全螢幕時關閉畫筆，筆跡仍顯示（標註層在全螢幕元素內）
  document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) setTool(null); });
  // 換段時顯示該段的標註：包住 seek，不改變 seek 的畫面與回傳值
  const baseSeek = window.seek;
  window.seek = async function (t) {
    const r = await baseSeek.call(this, t);
    const i = segOf(Number(t) || 0);
    if (i !== seg) { seg = i; closeInput(); redraw(); renderLabels(); }
    return r;
  };
  new ResizeObserver(fit).observe(board || stageEl);
  applyUi(); fit();
})();
let cur = 0, playing = false, last = 0;
const chap = document.getElementById('chapters');
const btns = SEGS.map((s, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = `${i + 1}・${s.name}`; b.onclick = () => { playerPause(); playerShow(s.a); };
  li.append(b); chap.append(li); return b;
});
function playerShow(t) {
  cur = clamp(t, 0, window.DURATION); scrub.value = cur;
  timeEl.textContent = `${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);
  const i = segIndex(cur); btns.forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
}
function playerTick(now) { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= window.DURATION) { cur = window.DURATION; playerPause(); } playerShow(cur); if (playing) requestAnimationFrame(playerTick); }
function playerPlay() { if (cur >= window.DURATION - 0.05) cur = 0; playing = true; playBtn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(playerTick); }
function playerPause() { playing = false; playBtn.textContent = '播放'; }
playBtn.onclick = () => (playing ? playerPause() : playerPlay());
scrub.oninput = () => { playerPause(); playerShow(Number(scrub.value)); };
document.getElementById('prev').onclick = () => { playerPause(); playerShow(SEGS[segIndex(cur - 0.6)].a); };
document.getElementById('next').onclick = () => { playerPause(); const i = segIndex(cur) + 1; playerShow(i < SEGS.length ? SEGS[i].a : window.DURATION); };
document.getElementById('fs').onclick = () => { const th = document.getElementById('theater'); document.fullscreenElement ? document.exitFullscreen() : th.requestFullscreen?.(); };
addEventListener('keydown', (e) => {
  if (document.documentElement.classList.contains('embed')) return;
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? playerPause() : playerPlay(); }
  else if (e.key === 'ArrowRight') document.getElementById('next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
window.ready.then(() => playerShow(cur));
// 研習平台嵌入契約（postMessage 握手，鍵名 ptt 為相容用）：被嵌入時才啟用
addEventListener('message', (e) => {
  if (e.source !== window.parent || window.parent === window) return;
  const m = e.data;
  if (!m || m.ptt !== 1 || m.type !== 'seek' || typeof m.t !== 'number' || !Number.isFinite(m.t)) return;
  window.seek(m.t);
});
if (window.parent !== window) window.ready.then(() => parent.postMessage({ ptt: 1, type: 'ready', duration: window.DURATION }, '*'));
</script>
